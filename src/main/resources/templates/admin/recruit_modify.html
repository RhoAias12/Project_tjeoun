<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공고 수정페이지</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/empl_modify.css}" />
    <script defer src="js/main.js"></script>
  </head>
  <body>
    <div th:replace="include/header :: header"></div>
    <div class="page-title">
      <p>공고 관리</p>
    </div>

    <div class="container">
      <section class="job-info">
        <div class="info-left">
          <div class="title">
            <input
                    type="text"
                    value="[인텔리전스랩스그룹] 데이터 분석가 (인게임 로그 및 비즈니스 인사이트 분석)"
            />
          </div>
          <div class="company">
            <input
                    type="text"
                    value="바이오리서치에이아이"
                    style="width: 100%; font-size: 15px"
            />
          </div>
          <div class="meta">
            <span class="deadline">
              마감일:
              <input type="date" value="2025-12-31" style="font-size: 13px" />
            </span>
            <span class="region" style="margin-left: 10px">
              지역:
              <input
                      type="text"
                      value="서울시 강남구"
                      style="font-size: 13px"
              />
            </span>
          </div>
        </div>
        <div class="info-right">
          <label for="logoUpload" class="logo-label"></label>
          <input type="file" id="logoUpload" accept="image/*" />
          <img
                  id="logoPreview"
                  src="/images/tjoeun.jpg"
                  alt="회사 로고"
                  class="logo"
          />
        </div>
      </section>

      <section class="job-desc">
        <h3>요구사항</h3>
        <textarea>
경력 : 신입 ~ 2년 이하 웹 프레임워크 백엔드 실무 경험 개발 스택 • Spring Framework 기반 Kotlin / Java • JPA, Querydsl • 데이터베이스 :
관계형 DB 설계·운영 이해 • 협업 도구 : Git / GitHub 기반 버전 관리,
Jira, Confluence • 개발 환경 : AWS 클라우드 [이런 사람을 원해요] •
스타트업의 빠른 사이클에서 비즈니스 목표에 맞춰 설계·개발할 수 있는 분
• 문서화를 즐기고, 지식 공유에 적극적인 분 • 스스로 일정 관리가
가능하며 책임감 있는 분 • 새로운 기술 학습에 열려 있고 꾸준히
성장하려는 분 • 긍정적 사고로 원활한 커뮤니케이션을 하는 분 • 개발
이야기를 나누고 토론하는 것을 좋아하시는 분
  </textarea
  >

        <h3>주요업무</h3>
        <textarea>
• 고가용성, 고확장성 아키텍처 및 API 설계, 개발, 테스트 및 운영 •
기획단의 요구사항 분석 및 솔루션 제안 • 잠재적인 기술 문제에 대한
예측, 해결 • 관계형 Database 관리 • 대용량 데이터의 효율적인 관리 •
서버 및 데이터 보안 • 기술 문서 작성
  </textarea
  >

        <h3>복지 및 혜택</h3>
        <textarea>
(함께 성장하는 설렘이 있는 회사를 만들고자 합니다.) • 유연한 근무 시간
(코어타임: 오전 11시 ~ 오후 5시(8h 근무)) • 게더타운에서 만나요! (매주
1회 고정 요일 재택근무) • 점심 식사비 지원 평균 11,000원 내외 • 보다
빠른 성과 인정 (연봉 인상 및 계약 주기 : 6개월) • 자율 연차 지원
(1시간 단위로 연차 사용 가능) • 멋진 동료는 최고의 복지 (열정적인

("oo"님 호칭 및 상호 존댓말 사용) • 우수/장기 근무자 스톡옵션 부여
(몰입할 수 있는 환경을 제공합니다.) • 최신 맥북Pro (개발자/디자이너) •
대형 모니터 (34인치 이상) • 무접점 키보드 및 장비 지원 • 고급 가죽
데스크매트(색 선택 필요) • 폴로 후드 집업, 후리스 등 (With 회사 로고)
• 고급 영양제 무제한 제공 • 각종 간식 무제한 제공 • 임직원 개별
시현하다 프로필 사진 촬영 • 쾌적한 편의시설 수면실 • 퍼포먼스 코치 및
멘토링 시스템 • 기타 업무에 필요한 제품 지원 (짧은 시간 동안 많은

및 최우수상 수상 (1위) • DCAMP 디데이 디캠프상 수상 (1위) •
아산나눔재단 마루 입주사 선정 • 서울대 더 비기닝 창업경진대회 장려상
수상 (5위) • 서울창조경제혁신 센터장상 수상 • 카이스트창업투자,
크릿벤처스, 소풍벤처스와 엔젤투자자 6인으로부터(10억원) Seed 투자유치
완료 • 데이터바우처 공급기업 선정 • 기업부설연구소 설립 • 신한 스퀘어
브릿지 주관 신한 인큐베이션 10기 선정 • 초기창업패키지 선정
(단국대학교) • 양재AI허브 입주사 선정 • 딥테크 팁스 선정 (15억원) •
카이스트창업투자, 흥국증권, 신한캐피탈, BSK인베스트먼트와 엔젤투자자
1인으로부터 (20억원) Pre-A 투자유치 • AWS Startup Growth Program – AI

엑셀러레이터 글로벌 오픈 이노베이션 「MUST. CONNECT 2024」 선정 •
중소벤처기업부, 2024년 팁스 해외마케팅 창업기업 선정(1억원)
  </textarea
  >

        <h3>연봉</h3>
        <textarea>면접 후 결정</textarea>
      </section>
    </div>
    <div class="button-group">
      <button type="button">목록보기</button>
      <button type="button">수정하기</button>
    </div>
    <div th:replace="include/footer :: footer"></div>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const logoUpload = document.getElementById('logoUpload');
        const logoPreview = document.getElementById('logoPreview');

        logoUpload.addEventListener('change', function () {
          const file = logoUpload.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
              logoPreview.src = e.target.result;
            };
            reader.readAsDataURL(file);
          }
        });
      });
    </script>
  </body>
</html>
