<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공고 수정페이지</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/empl_modify.css}" />
<!--    <script defer src="js/main.js"></script>-->
  </head>
  <body>
    <div th:replace="include/header :: header"></div>
    <div class="page-title">
      <p>공고 관리</p>
    </div>

    <form th:action="@{/admin/recruit_modify}" method="post" enctype="multipart/form-data" id="recruitForm">
      <input type="hidden" name="recruitmentIdx" th:value="${recruit.recruitmentIdx}" />
      <input type="hidden" name="page" th:value="${page}" />
      <input type="hidden" name="deadlineSort" th:value="${deadlineSort}" />
      <input type="hidden" name="logoUrl" th:value="${recruit.logoUrl}" />
      <div class="container">
        <section class="job-info">
          <div class="info-left">
            <div class="title">
              <input type="text" name="title" th:value="${recruit.title}" />
            </div>
            <div class="company">
              <input type="text" name="company" th:value="${recruit.company}" />
            </div>
            <div class="meta">
              <span class="deadline">
                마감일:
                <input type="date" name="deadline" th:value="${#temporals.format(recruit.deadline, 'yyyy-MM-dd')}" />
              </span>
              <span class="region" style="margin-left: 10px">
                지역:
                <input type="text" name="location" th:value="${recruit.location}" />
              </span>
            </div>
          </div>
          <div class="info-right">
            <label for="logoUpload" class="logo-label"></label>
            <input type="file" id="logoUpload" name="logo" accept="image/*" />
            <img id="logoPreview" th:src="@{${recruit.logoUrl}}" alt="회사 로고" class="logo" />
          </div>
        </section>

        <section class="job-desc">

          <h3>고용형태</h3>
          <textarea name="employmentType" th:utext="${recruit.employmentType}"></textarea>

          <h3>요구사항</h3>
          <textarea name="qualifications" th:utext="${recruit.qualifications}"></textarea>

          <h3>주요업무</h3>
          <textarea name="responsibilities" th:utext="${recruit.responsibilities}"></textarea>

          <h3>복지 및 혜택</h3>
          <textarea name="benefits" th:utext="${recruit.benefits}"></textarea>

          <h3>우대사항</h3>
          <textarea name="preferred" th:utext="${recruit.preferred}"></textarea>

          <h3>연봉</h3>
          <textarea name="salary" th:utext="${recruit.salary}"></textarea>
        </section>
      </div>
      <div class="button-group">
        <a th:href="@{/admin/recruit_list(page=${page}, deadlineSort=${deadlineSort})}">
          <button type="button">목록보기</button>
        </a>
        <button type="button" onclick="confirmSubmit()">수정하기</button>
      </div>
    </form>
  <div th:replace="include/footer :: footer"></div>
    <script>
      function confirmSubmit() {
        if (confirm("수정하시겠습니까?")) {
          document.getElementById('recruitForm').submit();
        }
      }

      // 로고 이미지 미리보기 기능
      document.addEventListener('DOMContentLoaded', function () {
        const logoUpload = document.getElementById('logoUpload');
        const logoPreview = document.getElementById('logoPreview');

        logoUpload.addEventListener('change', function () {
          const file = logoUpload.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
              logoPreview.src = e.target.result;
            };
            reader.readAsDataURL(file);
          }
        });
      });
    </script>
  </body>
</html>
