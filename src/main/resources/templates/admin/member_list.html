<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/header.css}" />
  <link rel="stylesheet" th:href="@{/css/footer.css}" />
  <link rel="stylesheet" th:href="@{/css/manager_list_care.css}" />
  <link
          rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
  <script>
    window.addEventListener('DOMContentLoaded', () => {
     const urlParams = new URLSearchParams(window.location.search);
     const primarySort = urlParams.get('primarySort') || 'userIdxDesc';
     const secondarySort = urlParams.get('secondarySort') || '';

     document.querySelectorAll('.pagination a').forEach(link => {
       const url = new URL(link.href);
       url.searchParams.set('primarySort', primarySort);
       url.searchParams.set('secondarySort', secondarySort);
       link.href = url.toString();
     });
   });

   function handleSortChange(selectElement) {
     const selectedSort = selectElement.value;
     // 정렬 시 항상 1페이지로 이동
     const url = new URL(window.location.href);
     url.searchParams.set("sortBy", selectedSort);
     url.searchParams.set("page", 1);
     window.location.href = url.toString();
   }
   function handleSortChange() {
   document.getElementById("sortForm").submit();
 }
  </script>
  <title>회원관리</title>
</head>
<body>
<!-- 헤더 -->
<div th:replace="include/header :: header"></div>

<!-- 전체 컨테이너 -->
<div class="tab-box">
  <div class="tab-inner">
    <h2 class="mypage-title">회원관리</h2>

    <!-- 검색 및 정렬 영역 -->
    <div class="search">
      <section class="search-bar">
        <input type="text" placeholder="이메일" />
        <input type="text" placeholder="닉네임" />
        <button type="button">검색</button>
      </section>

      <!-- ✅ 정렬 폼 -->
      <div class="sort-wrapper">
        <form id="sortForm" method="get" th:action="@{/admin/member_list}">
          <select name="primarySort" onchange="handleSortChange()">
            <option value="userIdxDesc" th:selected="${primarySort == 'userIdxDesc'}">가입: 최신순</option>
            <option value="userIdxAsc" th:selected="${primarySort == 'userIdxAsc'}">가입: 오래된순</option>
          </select>

          <select name="secondarySort" onchange="handleSortChange()">
            <option value="">-- 보조 정렬 없음 --</option>
            <option value="emailAsc" th:selected="${secondarySort == 'emailAsc'}">이메일 오름차순</option>
            <option value="emailDesc" th:selected="${secondarySort == 'emailDesc'}">이메일 내림차순</option>
            <option value="nicknameAsc" th:selected="${secondarySort == 'nicknameAsc'}">닉네임 오름차순</option>
            <option value="nicknameDesc" th:selected="${secondarySort == 'nicknameDesc'}">닉네임 내림차순</option>
          </select>

          <input type="hidden" name="page" th:value="${userPage.number + 1}" />
        </form>
      </div>
    </div>

    <!-- 회원 리스트 -->
    <div class="apply-list" th:if="${userList}">
      <div class="apply-card" th:each="user : ${userList}">
        <div class="apply-info">
          <a th:href="@{'/admin/member_modify'(userIdx=${user.userIdx}, page=${page}, primarySort=${primarySort}, secondarySort=${secondarySort})}"
             style="text-decoration:none; color:inherit; display:block;">
            <div class="job-title" th:text="${user.userEmail}">이메일</div>
            <div class="company-name" th:text="${user.userNickname}">닉네임</div>
          </a>
        </div>
        <div class="apply-buttons">
          <form th:action="@{/admin/member_list/delete}" method="post" style="display:inline;"
                onsubmit="return confirm('정말 삭제하시겠습니까?');">
            <input type="hidden" name="userIdx" th:value="${user.userIdx}" />
            <input type="hidden" name="page" th:value="${page}" />
            <input type="hidden" name="primarySort" th:value="${primarySort}" />
            <input type="hidden" name="secondarySort" th:value="${secondarySort}" />
            <button type="submit" class="cancel-btn">삭제</button>
          </form>

        </div>
      </div>
    </div>

    <!-- 페이지네이션 -->
    <div th:replace="fragments/pagination :: fragment
      (${userPage}, ${startPage}, ${endPage}, '/admin/member_list')">
    </div>
  </div>
</div>

<!-- 푸터 -->
<div th:replace="include/footer :: footer"></div>
</body>
</html>
