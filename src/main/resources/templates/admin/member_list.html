<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/header.css}" />
  <link rel="stylesheet" th:href="@{/css/footer.css}" />
  <link rel="stylesheet" th:href="@{/css/manager_list_care.css}" />
  <link
          rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const sortBy = urlParams.get('sortBy') || 'latest';
      const email = urlParams.get('email') || '';
      const nickname = urlParams.get('nickname') || '';

      document.querySelectorAll('.pagination a').forEach(link => {
        const linkUrl = new URL(link.href);
        linkUrl.searchParams.set('sortBy', sortBy);
        if (email) linkUrl.searchParams.set('email', email);
        if (nickname) linkUrl.searchParams.set('nickname', nickname);
        link.href = linkUrl.toString();
      });
    });

    function handleSortChange(selectElement) {
      const selectedSort = selectElement.value;
      const url = new URL(window.location.href);
      const params = url.searchParams;

      // 정렬 조건 세팅
      params.set("sortBy", selectedSort);

      // 페이지는 무조건 1로 리셋
      params.set("page", 1);

      // 기존 email, nickname 파라미터 유지
      const email = document.querySelector("input[name='email']")?.value;
      const nickname = document.querySelector("input[name='nickname']")?.value;
      if (email) params.set("email", email);
      else params.delete("email");

      if (nickname) params.set("nickname", nickname);
      else params.delete("nickname");

      // 최종 URL 이동
      url.search = params.toString();
      window.location.href = url.toString();
    }
    document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("searchForm");

    // 검색 버튼 클릭 또는 Enter로 form 제출될 때
    form.addEventListener("submit", function () {
      let pageInput = form.querySelector("input[name='page']");
      if (!pageInput) {
        pageInput = document.createElement("input");
        pageInput.type = "hidden";
        pageInput.name = "page";
        form.appendChild(pageInput);
      }
      pageInput.value = "1"; // 무조건 페이지 1로
    });
  });
  </script>

  <title>회원관리</title>
</head>
<body>
<!-- 헤더 -->
<div th:replace="~{include/header :: header}"></div>

<!-- 전체 컨테이너 -->
<div class="tab-box">
  <div class="tab-inner">
    <h2 class="mypage-title">회원관리</h2>

    <!-- 검색 및 정렬 영역 -->
    <div class="search">
      <form method="get" th:action="@{/admin/member_list}" id="searchForm">
        <section class="search-bar">
          <input type="text" name="email" placeholder="이메일" th:value="${email}" />
          <input type="text" name="nickname" placeholder="닉네임" th:value="${nickname}" />
          <button type="submit">검색</button>
        </section>

        <div class="sort-wrapper">
          <select name="sortBy" class="sort-select" onchange="handleSortChange(this)">
            <option value="latest" th:selected="${sortBy == 'latest'}">가입일 : 최신순</option>
            <option value="oldest" th:selected="${sortBy == 'oldest'}">가입일 : 오래된순</option>
            <option value="email" th:selected="${sortBy == 'email'}">이메일순 : 오름차순</option>
            <option value="emailDesc" th:selected="${sortBy == 'emailDesc'}">이메일순 : 내림차순</option>
            <option value="nickname" th:selected="${sortBy == 'nickname'}">닉네임순 : 오름차순</option>
            <option value="nicknameDesc" th:selected="${sortBy == 'nicknameDesc'}">닉네임순 : 내림차순</option>
          </select>
        </div>

        <input type="hidden" name="page" th:value="${userPage.number + 1}" />
      </form>
    </div>


    <!-- 회원 리스트 -->
    <div class="apply-list" th:if="${userList}">
      <div class="apply-card" th:each="user : ${userList}">
        <div class="apply-info">
          <a th:href="@{'/admin/member_modify'(
              userIdx=${user.userIdx},
              page=${userPage.number + 1},
              sortBy=${sortBy},
              email=${email},
              nickname=${nickname}
            )}"
             style="text-decoration:none; color:inherit; display:block;">
            <div class="job-title" th:text="${user.userEmail}">이메일</div>
            <div class="company-name" th:text="${user.userNickname}">닉네임</div>
          </a>
        </div>
        <div class="apply-buttons">
          <form th:action="@{/admin/member_list/delete}" method="post" style="display:inline;"
                onsubmit="return confirm('정말 삭제하시겠습니까?');">
            <input type="hidden" name="userIdx" th:value="${user.userIdx}" />
            <input type="hidden" name="page" th:value="${page}" />
            <input type="hidden" name="sortBy" th:value="${sortBy}" />
            <input type="hidden" name="email" th:value="${email}" />
            <input type="hidden" name="nickname" th:value="${nickname}" />
            <button type="submit" class="cancel-btn">삭제</button>
          </form>


        </div>
      </div>
    </div>

    <!-- 페이지네이션 -->
    <div th:replace="~{fragments/pagination :: fragment
      (${userPage}, ${startPage}, ${endPage}, '/admin/member_list')}"></div>
  </div>
</div>

<!-- 푸터 -->
<div th:replace="~{include/footer :: footer}"></div>
</body>
</html>
