<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>지원 관리</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/apply_detail.css}" />
<!--    <script defer th:src="@{/js/header.js}"></script>-->
<!--    <script defer th:src="@{/js/footer.js}"></script>-->

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const logoUpload = document.getElementById('logoUpload');
        if (logoUpload) {  // 요소가 있을 때만 실행
          logoUpload.addEventListener('change', function () {
            const file = logoUpload.files[0];
            if (file) {
              const reader = new FileReader();
              reader.onload = function (e) {
                document.getElementById('logoPreview').src = e.target.result;
              };
              reader.readAsDataURL(file);
            }
          });
        }
      });
    </script>

    <script>
      function confirmStatusChange() {
        const select = document.getElementById('statusSelect');
        const selectedText = select.options[select.selectedIndex].text;

        if (confirm(`${selectedText}(으)로 변경하시겠습니까?`)) {
          document.getElementById('statusForm').submit();
        }
      }

      // 변경 후 alert 메시지 띄우기
      const urlParams = new URLSearchParams(window.location.search);
      const statusChanged = urlParams.get("statusChanged");

      if (statusChanged) {
        alert(statusChanged + "으로 변경되었습니다.");
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    </script>
  </head>

  <body>
    <div th:replace="include/header :: header"></div>

    <div class="page-title">
      <p>지원 관리</p>
    </div>

    <div class="container">
      <!-- 공고 정보 -->
      <section class="job-info">
        <div class="info-left">
          <div class="title">
            <p class="readonly-box" th:text="${applyDetail.recruitmentTitle}"></p>
          </div>
          <div class="company">
            <p class="readonly-box" th:text="${applyDetail.recruitmentCompany}"></p>
          </div>
          <div class="meta">
            <span class="deadline">
              마감일: <p class="readonly-box-inline" th:text="${applyDetail.recruitmentDeadline}"></p>
            </span>
            &nbsp; &nbsp; &nbsp;
            <span class="region">
              지역: <p class="readonly-box-inline" th:text="${applyDetail.recruitmentLocation}"></p>
            </span>
          </div>
        </div>
        <div class="info-right">
          <img th:src="@{${applyDetail.recruitmentLogoUrl}}" alt="회사 로고" class="logo" />
        </div>
      </section>

      <div class="status-wrapper">
        <form id="statusForm" th:action="@{/admin/apply_detail/{id}/updateStatus(id=${applyHistoryId})}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
          <input type="hidden" name="page" th:value="${page}" />
          <input type="hidden" name="sort" th:value="${sort}" />

          <select class="status-select" name="newStatus" id="statusSelect">
            <option value="SUBMITTED" th:selected="${applyDetail.statusDisplay == '진행중'}">진행중</option>
            <option value="FINALIZED" th:selected="${applyDetail.statusDisplay == '합격'}">합격</option>
            <option value="REJECTED" th:selected="${applyDetail.statusDisplay == '불합격'}">불합격</option>
          </select>
        </form>
      </div>

      <!-- 상세 테이블 -->
      <form>
        <table class="resume-table">
          <!-- 제목 -->
          <tr>
            <th scope="row">제목</th>
            <td class="centered-cell">
              <div class="form-group">
                <p class="readonly-box1" th:text="${applyDetail.resumeTitle}"></p>
              </div>
            </td>
          </tr>

          <tr>
            <!-- 이미지 -->
            <th style="text-align: center">
              <img th:src="@{${applyDetail.resumeImg}}" alt="이미지" />
              <div id="fileName" style="margin-top: 4px"></div>
            </th>

            <!-- 오른쪽: 개인정보 출력 -->
            <td>
              <!-- 유저 정보 -->
              <div class="form-group">
                <label>이름</label>
                <p class="readonly-box1" th:text="${applyDetail.userName}"></p>
              </div>
              <div class="form-group">
                <label>이메일</label>
                <p class="readonly-box1" th:text="${applyDetail.userEmail}"></p>
              </div>
              <div class="form-group">
                <label>생년월일</label>
                <p class="readonly-box1" th:text="${applyDetail.userBirth}"></p>
              </div>

              <!-- Resume 상세 -->
              <div class="form-group">
                <label>주소</label>
                <p class="readonly-box1" th:text="${applyDetail.resumeAddress}"></p>
              </div>
              <div class="form-group">
                <label>전화번호</label>
                <p class="readonly-box1" th:text="${applyDetail.resumePhoneNum}"></p>
              </div>
              <div class="form-group">
                <label>학력</label>
                <p class="readonly-box1" th:text="${applyDetail.resumeEducation}"></p>
              </div>
              <div class="form-group">
                <label>자격증 및 스킬</label>
                <p class="readonly-box1" th:text="${applyDetail.resumeAbility}"></p>
              </div>
              <div class="form-group">
                <label>경력</label>
                <p class="readonly-box1" th:text="${applyDetail.resumeAntecedents}"></p>
              </div>
              <div class="form-group">
                <label>수상이력</label>
                <p class="readonly-box1" th:text="${applyDetail.resumeAwards}"></p>
              </div>
            </td>
          </tr>

          <tr th:each="content : ${applyDetail.resumeContentList}">
            <th>
              <div class="question">
                <p th:text="'질문: ' + ${content.question}"></p>
              </div>
            </th>
            <td>
              <p class="content" th:text="${content.context}"></p>
            </td>
          </tr>

          <!-- 추가 질문/답변 반복 -->
          <tr th:if="${applyDetail.resumeContext != null and !#strings.isEmpty(applyDetail.resumeContext)}">
            <th class="link">포트폴리오 링크를<br />넣어주세요.</th>
            <td>
              <p class="content link" th:text="${applyDetail.resumeContext}"></p>
            </td>
          </tr>
        </table>
      </form>

      <div class="button-group">
        <button type="button" onclick="confirmStatusChange()">수정</button>
        <button type="button"
                th:onclick="|location.href='@{/admin/apply_list(page=${page}, sortOption=${sortOption})}'|">
          목록
        </button>
      </div>

    </div>


    <div th:replace="include/footer :: footer"></div>
  </body>
</html>
