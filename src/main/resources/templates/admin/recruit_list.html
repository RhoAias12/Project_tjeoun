<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/manager_list_care.css}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script>
      document.querySelectorAll('.situation').forEach((el) => {
        const text = el.textContent.trim();
        if (text === '지원모집') {
          el.classList.add('open');
        } else if (text === '합격') {
          el.classList.add('pass');
        } else if (text === '지원마감') {
          el.classList.add('closed');
        } else if (text === '불합격') {
          el.classList.add('fail');
        }
      });
    </script>

    <title>공고관리</title>
  </head>
  <body>
    <!-- 헤더 -->
    <div th:replace="include/header :: header"></div>

    <!-- 전체 컨테이너 -->
    <div class="tab-box">
      <div class="tab-inner">
        <h2 class="mypage-title">공고관리</h2>

        <!-- 검색 및 정렬 영역 -->
        <div class="search">
          <section class="search-bar">
            <input type="text" placeholder="공고이름" />
            <input type="text" placeholder="회사명" />
            <input type="date" />
            <input type="text" placeholder="지역" />
            <button type="button">검색</button>
          </section>

          <div class="sort-wrapper">
            <select class="sort-select">
              <option value="latest">최신순</option>
              <option value="oldest">오래된순</option>
              <option value="company">회사명순</option>
            </select>
          </div>
        </div>

        <!-- 게시물 리스트 -->
        <div class="apply-list">
          <div class="apply-card">
            <div class="apply-info">
              <div class="job-title">공고명</div>
              <div class="company-name">회사명</div>
            </div>
            <div class="apply-buttons">
              <!-- <div class="situation">지원상태</div> -->
              <div class="situation open">지원모집</div>
              <!-- <div class="situation pass">합격</div>
              <div class="situation closed">지원마감</div>
              <div class="situation fail">불합격</div> -->

              <button class="cancel-btn">삭제</button>
            </div>
          </div>

          <div class="apply-card">
            <div class="apply-info">
              <div class="job-title">공고명</div>
              <div class="company-name">회사명</div>
            </div>
            <div class="apply-buttons">
              <!-- <div class="situation">지원상태</div> -->
              <!-- <div class="situation open">지원모집</div> -->
              <div class="situation pass">합격</div>
              <!-- <div class="situation closed">지원마감</div>
              <div class="situation fail">불합격</div> -->
              <button class="cancel-btn">삭제</button>
            </div>
          </div>

          <div class="apply-card">
            <div class="apply-info">
              <div class="job-title">공고명</div>
              <div class="company-name">회사명</div>
            </div>
            <div class="apply-buttons">
              <!-- <div class="situation">지원상태</div> -->
              <!-- <div class="situation open">지원모집</div>
              <div class="situation pass">합격</div> -->
              <div class="situation closed">지원마감</div>
              <!-- <div class="situation fail">불합격</div> -->
              <button class="cancel-btn">삭제</button>
            </div>
          </div>
          <div class="apply-card">
            <div class="apply-info">
              <div class="job-title">공고명</div>
              <div class="company-name">회사명</div>
            </div>
            <div class="apply-buttons">
              <!-- <div class="situation">지원상태</div> -->
              <!-- <div class="situation open">지원모집</div>
              <div class="situation pass">합격</div>
              <div class="situation closed">지원마감</div> -->
              <div class="situation fail">불합격</div>
              <button class="cancel-btn">삭제</button>
            </div>
          </div>
        </div>

        <!-- 페이지네이션 -->
        <div class="pagination">
          <ul class="pagination-list">
            <li><a href="#" class="page-btn">〈</a></li>
            <li><a href="#" class="page-btn active">1</a></li>
            <li><a href="#" class="page-btn">2</a></li>
            <li><a href="#" class="page-btn">3</a></li>
            <li><a href="#" class="page-btn">4</a></li>
            <li><a href="#" class="page-btn">5</a></li>
            <li><a href="#" class="page-btn">〉</a></li>
          </ul>
        </div>
      </div>
    </div>
    <!-- 푸터 -->
    <div th:replace="include/footer :: footer"></div>
  </body>
</html>
