<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/manager_list_care.css}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <title>공고관리</title>
  </head>
  <body>
    <!-- 헤더 -->
    <div th:replace="include/header :: header"></div>

    <!-- 전체 컨테이너 -->
    <div class="tab-box">
      <div class="tab-inner">
        <h2 class="mypage-title">공고관리</h2>

        <!-- 검색 및 정렬 영역 (향후 기능 확장 가능) -->
        <div class="search">
          <section class="search-bar">
            <input type="text" placeholder="공고이름" />
            <input type="text" placeholder="회사명" />
            <input type="date" />
            <input type="text" placeholder="지역" />
            <button type="button">검색</button>
          </section>

          <div class="sort-wrapper">
            <select class="sort-select">
              <option value="latest">최신순</option>
              <option value="oldest">오래된순</option>
              <option value="company">회사명순</option>
            </select>
          </div>
        </div>

        <!-- 삭제 완료 메시지 -->
        <div th:if="${message}" class="alert-box">
          <p th:text="${message}"></p>
        </div>

        <!-- 공고 리스트 -->
        <div class="apply-list">
          <div th:each="recruit : ${recruitmentList}"
               class="apply-card"
               th:onclick="|location.href='@{/admin/recruit_modify(recruitmentIdx=${recruit.recruitmentIdx})}'|"
               style="cursor: pointer;">
            <div class="apply-info">
              <div class="job-title" th:text="${recruit.title}">공고명</div>
              <div class="company-name" th:text="${recruit.company}">회사명</div>
            </div>
            <div class="apply-buttons">
              <div class="situation"
                   th:text="${recruit.deadline.isBefore(T(java.time.LocalDate).now()) ? '지원마감' : '지원모집'}"
                   th:classappend="${recruit.deadline.isBefore(T(java.time.LocalDate).now()) ? 'closed' : 'open'}">
                공고상태
              </div>
              <form th:action="@{/admin/recruit_delete}" method="post"
                    th:onsubmit="return confirm('정말 삭제하시겠습니까?');"
                    style="margin-left: 10px;">
                <input type="hidden" name="recruitmentIdx" th:value="${recruit.recruitmentIdx}" />
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="cancel-btn" onclick="event.stopPropagation();">삭제</button>
              </form>
            </div>
          </div>
        </div>

        <!-- 페이지네이션 -->
        <div class="pagination">
          <ul class="pagination-list">
            <li><a href="#" class="page-btn">〈</a></li>
            <li><a href="#" class="page-btn active">1</a></li>
            <li><a href="#" class="page-btn">2</a></li>
            <li><a href="#" class="page-btn">3</a></li>
            <li><a href="#" class="page-btn">4</a></li>
            <li><a href="#" class="page-btn">5</a></li>
            <li><a href="#" class="page-btn">〉</a></li>
          </ul>
        </div>
      </div>
    </div>
    <!-- 푸터 -->
    <div th:replace="include/footer :: footer"></div>
  </body>
</html>
