<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/manager_list_care.css}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <title>공고관리</title>

    <script>
      function onSortChange() {
        const scrapSort = document.getElementById("scrapSort").value;
        const deadlineSort = document.getElementById("deadlineSort").value;
        const url = `/admin/recruit_list?scrapSort=${scrapSort}&deadlineSort=${deadlineSort}`;
        location.href = url;
      }
    </script>

  </head>
  <body>
    <!-- 헤더 -->
    <div th:replace="include/header :: header"></div>

    <!-- 전체 컨테이너 -->
    <div class="tab-box">
      <div class="tab-inner">
        <h2 class="mypage-title">공고관리</h2>

        <!-- 검색 및 정렬 영역  -->
        <div class="search">
          <section class="search-bar">
            <input type="text" placeholder="공고이름" />
            <input type="text" placeholder="회사명" />
            <input type="date" />
            <input type="text" placeholder="지역" />
            <button type="button">검색</button>
          </section>

          <div class="sort-wrapper" style="display: flex; gap: 10px;">
            <form method="get" th:action="@{/admin/recruit_list}" style="display: flex; gap: 10px;">

              <select class="sort-select" name="favoriteSort" onchange="this.form.submit()">
                <option value="favorite_all" th:selected="${favoriteSort == 'favorite_all'}">스크랩: 전체</option>
                <option value="favorite_desc" th:selected="${favoriteSort == 'favorite_desc'}">스크랩: 많은순</option>
                <option value="favorite_asc" th:selected="${favoriteSort == 'favorite_asc'}">스크랩: 적은순</option>
              </select>

              <select class="sort-select" name="deadlineSort" onchange="this.form.submit()">
                <option value="deadline_all" th:selected="${deadlineSort == 'deadline_all'}">마감일: 전체</option>
                <option value="deadline_desc" th:selected="${deadlineSort == 'deadline_desc'}">마감일: 많은순</option>
                <option value="deadline_asc" th:selected="${deadlineSort == 'deadline_asc'}">마감일: 적은순</option>
              </select>

              <input type="hidden" name="page" th:value="${page}" />
            </form>
          </div>
        </div>

        <!-- 삭제 완료 메시지 -->
        <div th:if="${message}" class="alert-box">
          <p th:text="${message}"></p>
        </div>

        <!-- 공고 리스트 -->
        <div class="apply-list">
          <div th:each="recruit : ${recruitmentList}"
               class="apply-card"
               th:onclick="|location.href='@{/admin/recruit_modify(recruitmentIdx=${recruit.recruitmentIdx})}'|"
               style="cursor: pointer;">
            <div class="apply-info">
              <div class="job-title" th:text="${recruit.title}">공고명</div>
              <div class="company-name" th:text="${recruit.company}">회사명</div>
            </div>
            <div class="apply-buttons">
              <div class="situation"
                   th:text="${recruit.deadline.isBefore(T(java.time.LocalDate).now()) ? '지원마감' : '지원모집'}"
                   th:classappend="${recruit.deadline.isBefore(T(java.time.LocalDate).now()) ? 'closed' : 'open'}">
                공고상태
              </div>
              <form th:action="@{/admin/recruit_delete}" method="post"
                    th:onsubmit="return confirm('정말 삭제하시겠습니까?');"
                    style="margin-left: 10px;">
                <input type="hidden" name="recruitmentIdx" th:value="${recruit.recruitmentIdx}" />
                <input type="hidden" name="page" th:value="${page}" />
                <input type="hidden" name="favoriteSort" th:value="${favoriteSort}" />
                <input type="hidden" name="deadlineSort" th:value="${deadlineSort}" />
                <button type="submit" class="cancel-btn" onclick="event.stopPropagation();">삭제</button>
              </form>
            </div>
          </div>
        </div>

        <!-- 페이지네이션 -->
        <div th:replace="fragments/pagination :: fragment
          (${recruitmentPage}, ${startPage}, ${endPage}, ${url})">
        </div>
      </div>
    </div>
    <!-- 푸터 -->
    <div th:replace="include/footer :: footer"></div>
  </body>
</html>
