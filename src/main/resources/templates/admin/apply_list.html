<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="js/header.js"></script>
    <script src="js/footer.js"></script>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/apply_list.css}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <title>지원관리</title>
  </head>
  <body>
    <!-- 헤더 -->
    <div th:replace="include/header :: header"></div>

    <!-- 전체 컨테이너 -->
    <div class="tab-box">
      <div class="tab-inner">
        <h2 class="mypage-title">지원관리</h2>

        <!-- 검색 및 정렬 영역 -->
        <div class="search">
          <section class="search-bar">
            <input type="text" placeholder="공고이름" />
            <input type="text" placeholder="회사명" />
            <input type="date" />
            <input type="text" placeholder="지역" />
            <button type="button">검색</button>
          </section>

          <div class="sort-wrapper">
            <select class="sort-select">
              <option value="latest">최신순</option>
              <option value="oldest">오래된순</option>
              <option value="company">회사명순</option>
            </select>
          </div>
        </div>

        <!-- 게시물 리스트 -->
        <div class="apply-list">
          <div class="apply-card">
            <div class="apply-info">
              <div class="job-title">
                공고명<span class="company-name"> | 회사명</span>
              </div>
              <div class="nickname">닉네임</div>
            </div>
            <div class="apply-buttons">
              <!-- 상황별로 하나만 보이게 처리 -->
              <div class="situation open">접수중</div>
              <!-- <div class="situation pass">합격</div> -->
              <!-- <div class="situation fail">불합격</div> -->
            </div>
            <!-- 토글 
            <div class="apply-buttons">
              <select class="status-select">
                <option value="open" selected>접수중</option>
                <option value="closed">접수마감</option>
              </select>
            </div> -->
          </div>

          <div class="apply-card">
            <div class="apply-info">
              <div class="job-title">
                공고명<span class="company-name"> | 회사명</span>
              </div>
              <div class="nickname">닉네임</div>
            </div>
            <div class="apply-buttons">
              <!-- 상황별로 하나만 보이게 처리 -->
              <!-- <div class="situation open">접수중</div> -->
              <div class="situation pass">합격</div>
              <!-- <div class="situation fail">불합격</div> -->
            </div>
          </div>

          <div class="apply-card">
            <div class="apply-info">
              <div class="job-title">
                공고명<span class="company-name"> | 회사명</span>
              </div>
              <div class="nickname">닉네임</div>
            </div>
            <div class="apply-buttons">
              <!-- 상황별로 하나만 보이게 처리 -->
              <!-- <div class="situation open">접수중</div> -->
              <!-- <div class="situation pass">합격</div> -->
              <div class="situation fail">불합격</div>
            </div>
          </div>

          <div class="apply-card">
            <div class="apply-info">
              <div class="job-title">
                공고명<span class="company-name"> | 회사명</span>
              </div>
              <div class="nickname">닉네임</div>
            </div>
            <div class="apply-buttons">
              <!-- 상황별로 하나만 보이게 처리 -->
              <!-- <div class="situation open">접수중</div> -->
              <!-- <div class="situation pass">합격</div> -->
              <div class="situation fail">불합격</div>
            </div>
          </div>
        </div>

        <!-- 페이지네이션 -->
        <div class="pagination">
          <ul class="pagination-list">
            <li><a href="#" class="page-btn">〈</a></li>
            <li><a href="#" class="page-btn active">1</a></li>
            <li><a href="#" class="page-btn">2</a></li>
            <li><a href="#" class="page-btn">3</a></li>
            <li><a href="#" class="page-btn">4</a></li>
            <li><a href="#" class="page-btn">5</a></li>
            <li><a href="#" class="page-btn">〉</a></li>
          </ul>
        </div>
      </div>
    </div>
    <!-- 푸터 -->
    <div th:replace="include/footer :: footer"></div>
  </body>
</html>
