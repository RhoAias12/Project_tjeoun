<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!--  <script src="js/header.js"></script>-->
<!--  <script src="js/footer.js"></script>-->
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/header.css}" />
  <link rel="stylesheet" th:href="@{/css/footer.css}" />
  <link rel="stylesheet" th:href="@{/css/apply_list.css}" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />

  <title>이력서 선택</title>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const sortOption = urlParams.get('sortOption') || 'all';

      document.querySelectorAll('.pagination a').forEach(link => {
        const linkUrl = new URL(link.href);
        linkUrl.searchParams.set('sortOption', sortOption);
        link.href = linkUrl.toString();
      });
    });

    window.addEventListener('DOMContentLoaded', () => {
      const startInput = document.getElementById('startDate');
      const endInput = document.getElementById('endDate');

      function validateDates(changedField) {
        const startDateVal = startInput.value;
        const endDateVal = endInput.value;

        if (!startDateVal || !endDateVal) return;

        const startDate = new Date(startDateVal);
        const endDate = new Date(endDateVal);

        if (startDate > endDate) {
          if (changedField === 'start') {
            alert('시작일은 마감일보다 늦을 수 없습니다.');
          } else if (changedField === 'end') {
            alert('마감일은 시작일보다 빠를 수 없습니다.');
          }

          // 잘못된 값 초기화
          startInput.value = '';
          endInput.value = '';
        }
      }

      startInput.addEventListener('change', () => validateDates('start'));
      endInput.addEventListener('change', () => validateDates('end'));
    });
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const queryParams = new URLSearchParams(window.location.search);
      const keys = [
        "page", "sortOption", "title", "company", "email",
        "nickname", "status", "startDate", "endDate"
      ];

      const paramMap = new URLSearchParams();
      keys.forEach(key => {
        const val = queryParams.get(key);
        if (val && val.trim() !== "" && val !== "null") {
          paramMap.set(key, val);
        }
      });

      document.querySelectorAll(".apply-card").forEach(card => {
        card.addEventListener("click", function (e) {
          e.preventDefault();
          const applyId = card.getAttribute("data-id");
          const baseUrl = `/admin/apply_detail/${applyId}`;
          const finalUrl = baseUrl + (paramMap.toString() ? `?${paramMap.toString()}` : "");
          window.location.href = finalUrl;
        });
      });
    });
  </script>


</head>
<body>
<!-- 헤더 -->
<div th:replace="include/header :: header"></div>

<!-- 전체 컨테이너 -->
<div class="tab-box">
  <div class="tab-inner">
    <h2 class="mypage-title">지원관리</h2>

    <!-- 검색 및 정렬 영역 -->
    <div class="search">
      <form class="search-bar" method="get" th:action="@{/admin/apply_list}" id="searchSortForm">
        <input type="text" name="title" placeholder="공고이름" th:value="${title}" />
        <input type="text" name="company" placeholder="회사명" th:value="${company}" />
        <input type="text" name="email" placeholder="이메일" th:value="${email}" />
        <input type="text" name="nickname" placeholder="닉네임" th:value="${nickname}" />

        <div class="date-range">
          <div class="date-group">
            <label for="startDate">시작일</label>
            <input type="date" name="startDate" id="startDate" th:value="${startDate}" />
          </div>
          <span class="tilde">-</span>
          <div class="date-group">
            <label for="endDate">마감일</label>
            <input type="date" name="endDate" id="endDate" th:value="${endDate}" />
          </div>
          <button type="submit">검색</button>
        </div>

        <div class="sort-wrapper">
          <select class="sort-select" name="status" onchange="this.form.submit()">
            <option value="" th:selected="${status == null}">상태 전체</option>
            <option value="SUBMITTED" th:selected="${status == 'SUBMITTED'}">진행중</option>
            <option value="FINALIZED" th:selected="${status == 'FINALIZED'}">합격</option>
            <option value="REJECTED" th:selected="${status == 'REJECTED'}">불합격</option>
          </select>

          <select name="sortOption" class="sort-select" onchange="this.form.submit()">
            <option value="all" th:selected="${sortOption == 'all'}">전체</option>
            <option value="apply_latest" th:selected="${sortOption == 'apply_latest'}">지원일: 최신순</option>
            <option value="apply_oldest" th:selected="${sortOption == 'apply_oldest'}">지원일: 오래된순</option>
            <option value="deadline_latest" th:selected="${sortOption == 'deadline_latest'}">마감일: 최신순</option>
            <option value="deadline_oldest" th:selected="${sortOption == 'deadline_oldest'}">마감일: 오래된순</option>
          </select>

          <input type="hidden" name="page" value="1" />
        </div>
      </form>
    </div>

    <!-- 게시물 리스트 -->
    <div class="apply-list" th:each="apply : ${applyList}">
      <a href="#" class="apply-card" th:attr="data-id=${apply.applyHistoryId}">
        <div class="apply-info">
          <div class="job-title" th:text="${apply.recruitmentTitle}">공고명</div>
          <div class="company-name" th:text="${apply.recruitmentCompany}">회사명</div>
          <div class="nickname">
            <span th:text="${apply.userEmail}">이메일</span>
            <span> | </span>
            <span th:text="${apply.userNickname}">닉네임</span>
          </div>
        </div>
        <div class="apply-buttons">
          <div class="situation open" th:text="${apply.statusDisplay}">지원상태</div>
        </div>
      </a>
    </div>

    <!-- 페이지네이션 -->
    <div class="pagination">
      <div th:replace="fragments/pagination :: fragment
        (${applyPage}, ${startPage}, ${endPage}, ${url})">
      </div>
    </div>
</div>
</div>

<!-- 푸터 -->
<div th:replace="include/footer :: footer"></div>
</body>
</html>
