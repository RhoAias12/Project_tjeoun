<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공고 상세페이지</title>

  <!-- CSRF 토큰 -->
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />

  <!-- CSS -->
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/header.css}" />
  <link rel="stylesheet" th:href="@{/css/footer.css}" />
  <link rel="stylesheet" th:href="@{/css/empl_detail.css}" />
  <link rel="stylesheet" th:href="@{/css/chat.css}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <script>
    //chat 챗봇
function toggleChat() {
  const popup = document.getElementById("chatPopup");
  popup.style.display = (popup.style.display === "block") ? "none" : "block";
  }

  async function sendMessage() {
  const inputEl = document.getElementById("userInput");
  const message = inputEl.value.trim();
  if (!message) return;

  const chatBox = document.getElementById("chatBox");

  // 유저 메시지 추가
  const userMsg = document.createElement("div");
  userMsg.className = "message user-message";
  userMsg.textContent = message;
  chatBox.appendChild(userMsg);

  inputEl.value = "";

  // 작성중 메시지 추가
  const botMsg = document.createElement("div");
  botMsg.className = "message bot-message";
  botMsg.textContent = "... 작성중입니다";
  chatBox.appendChild(botMsg);
  chatBox.scrollTop = chatBox.scrollHeight;

  try {
   const response = await fetch("/api/chat", {
     method: "POST",
     headers: { "Content-Type": "application/json" },
     body: JSON.stringify({ input: message }),
   });

   if (!response.ok) {
     const errorText = await response.text();
     console.error("서버 오류:", errorText);

     // 작성중 메시지를 에러로 대체
     botMsg.classList.add("error-message");
     botMsg.textContent = "❌ 서버 오류가 발생했어요.\n" + errorText;
     chatBox.scrollTop = chatBox.scrollHeight;
     return;
   }

   const data = await response.json();

   // 작성중 메시지를 답변으로 대체
   botMsg.textContent = data.reply;
   chatBox.scrollTop = chatBox.scrollHeight;

  } catch (error) {
   console.error("요청 실패:", error);

   // 작성중 메시지를 네트워크 에러로 대체
   botMsg.classList.add("error-message");
   botMsg.textContent = "❌ 요청 실패: " + error;
   chatBox.scrollTop = chatBox.scrollHeight;
  }
  }

  // 엔터 키로 전송
  document.addEventListener("DOMContentLoaded", () => {
  const inputEl = document.getElementById("userInput");
  inputEl.addEventListener("keydown", function(event) {
   if (event.key === "Enter" && !event.shiftKey) {
     event.preventDefault();
     sendMessage();
   }
  });
});

  </script>
</head>

<body>
<div th:replace="include/header :: header"></div>

<div class="search">
  <form action="/empl/empl_main" method="get" class="search-bar">
    <input type="text" placeholder="공고이름" name="title" th:value="${title}" />
    <input type="text" placeholder="공고내용" name="content" th:value="${content}" />
    <input type="text" placeholder="지역" name="region" th:value="${region}" />
    <input type="text" placeholder="회사명" name="company" th:value="${company}" />
    <div class="date-range">
      <div class="date-group">
        <label for="startDate">시작일</label>
        <input type="date" name="startDate" id="startDate" th:value="${startDate}" />
      </div>
      <span class="tilde">-</span>
      <div class="date-group">
        <label for="endDate">마감일</label>
        <input type="date" name="endDate" id="endDate" th:value="${endDate}" />
      </div>
    </div>
    <button type="submit">검색</button>
  </form>
</div>

<div class="container">
  <section class="job-info">
    <div class="info-left">
      <div class="title" th:text="${job.title}">공고 제목</div>
      <div class="company" th:text="${job.company}">회사명</div>
      <div class="meta">
          <span class="deadline"
                th:text="${#strings.startsWith(job.deadline.toString(), '9999') ? '상시채용' : '마감일: ' + job.deadline}">
          </span>
        <span><p>|</p></span>
        <span class="region" th:text="'지역: ' + ${job.location}">지역</span>
      </div>
    </div>
    <div class="info-right">
      <img th:src="${job.logoUrl}" alt="회사 로고" class="logo" />
    </div>
  </section>

  <section class="job-desc">
    <h3>고용형태</h3>
    <p th:text="${job.employmentType}" style="white-space: pre-wrap;"></p>

    <h3>요구사항</h3>
    <p th:text="${job.qualifications}" style="white-space: pre-wrap;"></p>

    <h3>주요업무</h3>
    <p th:text="${job.responsibilities}" style="white-space: pre-wrap;"></p>

    <h3>복지 및 혜택</h3>
    <p th:text="${job.benefits}" style="white-space: pre-wrap;"></p>

    <h3>우대사항</h3>
    <p th:text="${job.preferred}" style="white-space: pre-wrap;"></p>

    <h3>연봉</h3>
    <p th:text="${job.salary}" style="white-space: pre-wrap;"></p>
  </section>
</div>

<div class="button-group">
  <!-- 북마크 버튼: 로그인한 사용자만 표시 -->
  <button
          type="button"
          class="bookmark-icon"
          sec:authorize="hasAuthority('ROLE_USER')"
          th:classappend="${isFavorited} ? ' active' : ''"
          onclick="toggleBookmark(this)"
          th:attr="data-id=${job.recruitmentIdx}">
    <i class="fa-bookmark"
       th:classappend="${isFavorited} ? ' fa-solid' : ' fa-regular'"></i>
  </button>

  <!-- 비로그인 사용자에게는 회색 비활성 아이콘 + 로그인 유도 -->
  <button
          type="button"
          class="bookmark-icon inactive"
          th:unless="${#authorization.expression('isAuthenticated()')}"
          onclick="alert('로그인 후 이용해 주세요.'); location.href='/user/login'">
    <i class="fa-bookmark fa-regular"></i>
  </button>

  <button type="button"
          class="apply-button"
          th:attr="data-recruitment-id=${job.recruitmentIdx}"
          sec:authorize="hasAuthority('ROLE_USER')"
          onclick="checkAndGoApply(this)">
    지원하기
  </button>

  <button type="button"
          onclick="goBackWithRefreshParam()">
    목록보기
  </button>

</div>

<!-- chat.html -->
<!-- 채팅 토글 버튼 -->
<div class="chat-toggle-button" onclick="toggleChat()">💬</div>

<!-- 채팅 팝업 -->
<div class="chat-popup" id="chatPopup">
  <div class="chat-header">
    <span class="chat-title">AI Chat</span>
    <button class="close-btn" onclick="toggleChat()">✖️</button>
  </div>

  <!-- 메시지 영역 -->
  <div class="chat-box" id="chatBox">
    <!-- 여기에 메시지들이 들어감 -->
  </div>

  <!-- 입력창은 형제로 따로! -->
  <div class="input-box">
    <input type="text" id="userInput" placeholder="메시지를 입력하세요..." />
    <button onclick="sendMessage()">전송</button>
  </div>
</div>

<div th:replace="include/footer :: footer"></div>

<script th:inline="javascript">
  let isLogin = /*[[${#authorization.expression('isAuthenticated()')}]]*/ false;

  /*<![CDATA[*/
  let prevUrl = /*[[${prevUrl != null ? prevUrl : '/empl/empl_main'}]]*/ '/empl/empl_main';
  let page = /*[[${page}]]*/ 1;
  let sortOrder = /*[[${sortOrder != null ? sortOrder : ''}]]*/ '';
  let title = /*[[${title != null ? title : ''}]]*/ '';
  let content = /*[[${content != null ? content : ''}]]*/ '';
  let region = /*[[${region != null ? region : ''}]]*/ '';
  let company = /*[[${company != null ? company : ''}]]*/ '';
  let startDate = /*[[${startDate != null ? startDate : ''}]]*/ '';
  let endDate = /*[[${endDate != null ? endDate : ''}]]*/ '';

  function goBackWithRefreshParam() {
    const params = new URLSearchParams();

    params.append('page', page);
    if (sortOrder) params.append('sortOrder', sortOrder);
    if (title) params.append('title', title);
    if (content) params.append('content', content);
    if (region) params.append('region', region);
    if (company) params.append('company', company);
    if (startDate) params.append('startDate', startDate);
    if (endDate) params.append('endDate', endDate);

    // 새로고침용 랜덤 파라미터 추가
    params.append('refresh', Math.random().toString().slice(2));

    // URL 조합
    const delimiter = prevUrl.includes('?') ? '&' : '?';
    location.href = prevUrl + delimiter + params.toString();
  }
  /*]]>*/
</script>

<script>
  function toggleBookmark(button) {
    if (!isLogin) {
      alert('로그인 후 이용해 주세요.');
      location.href = '/user/login';
      return;
    }

    const recruitmentId = button.getAttribute("data-id");
    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute("content");
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute("content");

    fetch('/favorite/toggle', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
        [csrfHeader]: csrfToken
      },
      body: new URLSearchParams({ recruitmentId })
    })
    .then(response => response.text())
    .then(result => {
      const icon = button.querySelector('i');
      icon.classList.remove('fa-regular', 'fa-solid');

      if (result === 'favorited') {
        icon.classList.add('fa-solid');
        button.classList.add('active');
        button.title = '스크랩됨';
      } else {
        icon.classList.add('fa-regular');
        button.classList.remove('active');
        button.title = '스크랩';
      }
    })
    .catch(err => {
      console.error('스크랩 처리 중 오류:', err);
      alert('스크랩 처리 중 오류가 발생했습니다.');
    });
  }
</script>

<script>
  function checkAndGoApply(button) {
    const recruitmentId = button.getAttribute("data-recruitment-id");

    fetch(`/mypage/check-applied?recruitmentIdx=${recruitmentId}`)
      .then(response => response.json())
      .then(isApplied => {
        if (isApplied) {
          alert("이미 지원한 공고입니다. 중복 지원은 불가능합니다.");
        } else {
          // 이력서 선택 페이지로 이동
          location.href = `/mypage/choice_list/${recruitmentId}`;
        }
      })
      .catch(err => {
        console.error("지원 여부 확인 실패:", err);
        alert("지원 여부 확인 중 오류가 발생했습니다.");
      });
  }
</script>

</body>
</html>
