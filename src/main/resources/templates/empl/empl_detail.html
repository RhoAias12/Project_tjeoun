<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공고 상세페이지</title>

  <script th:inline="javascript">
    let isLogin = /*[[${#authorization.expression('isAuthenticated()')}]]*/ false;

    function goBackWithRefreshParam() {
    const prevUrl = /*[[${prevUrl != null ? prevUrl : '/empl/empl_main'}]]*/ '/empl/empl_main';
    const delimiter = prevUrl.includes('?') ? '&' : '?';
    const random = Math.random().toString().slice(2);
    location.href = `${prevUrl}${delimiter}refresh=${random}`;
  }
  </script>

  <!-- CSRF 토큰 -->
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />

  <!-- CSS -->
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/header.css}" />
  <link rel="stylesheet" th:href="@{/css/footer.css}" />
  <link rel="stylesheet" th:href="@{/css/empl_detail.css}" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
<div th:replace="include/header :: header"></div>

<div class="search">
  <section class="search-bar">
    <input type="text" placeholder="공고이름" name="title" />
    <input type="text" placeholder="공고내용" name="content" />
    <input type="text" placeholder="지역" name="region" />
    <input type="text" placeholder="회사명" name="company" />

    <div class="date-range">
      <div class="date-group">
        <label for="startDate">시작일</label>
        <input type="date" name="startDate" id="startDate" />
      </div>
      <span class="tilde">-</span>
      <div class="date-group">
        <label for="endDate">마감일</label>
        <input type="date" name="endDate" id="endDate" />
      </div>
    </div>
    <button type="submit">검색</button>
  </section>
</div>

<div class="container">
  <section class="job-info">
    <div class="info-left">
      <div class="title" th:text="${job.title}">공고 제목</div>
      <div class="company" th:text="${job.company}">회사명</div>
      <div class="meta">
          <span class="deadline"
                th:text="${#strings.startsWith(job.deadline.toString(), '9999') ? '상시채용' : '마감일: ' + job.deadline}">
          </span>
        <span><p>|</p></span>
        <span class="region" th:text="'지역: ' + ${job.location}">지역</span>
      </div>
    </div>
    <div class="info-right">
      <img th:src="${job.logoUrl}" alt="회사 로고" class="logo" />
    </div>
  </section>

  <section class="job-desc">
    <h3>고용형태</h3>
    <p th:text="${job.employmentType}" style="white-space: pre-wrap;"></p>

    <h3>요구사항</h3>
    <p th:text="${job.qualifications}" style="white-space: pre-wrap;"></p>

    <h3>주요업무</h3>
    <p th:text="${job.responsibilities}" style="white-space: pre-wrap;"></p>

    <h3>복지 및 혜택</h3>
    <p th:text="${job.benefits}" style="white-space: pre-wrap;"></p>

    <h3>우대사항</h3>
    <p th:text="${job.preferred}" style="white-space: pre-wrap;"></p>

    <h3>연봉</h3>
    <p th:text="${job.salary}" style="white-space: pre-wrap;"></p>
  </section>
</div>

<div class="button-group">
  <!-- 북마크 버튼: 로그인한 사용자만 표시 -->
  <button
          type="button"
          class="bookmark-icon"
          sec:authorize="hasAuthority('ROLE_USER')"
          th:classappend="${isFavorited} ? ' active' : ''"
          onclick="toggleBookmark(this)"
          th:attr="data-id=${job.recruitmentIdx}">
    <i class="fa-bookmark"
       th:classappend="${isFavorited} ? ' fa-solid' : ' fa-regular'"></i>
  </button>

  <!-- 비로그인 사용자에게는 회색 비활성 아이콘 + 로그인 유도 -->
  <button
          type="button"
          class="bookmark-icon inactive"
          th:unless="${#authorization.expression('isAuthenticated()')}"
          onclick="alert('로그인 후 이용해 주세요.'); location.href='/user/login'">
    <i class="fa-bookmark fa-regular"></i>
  </button>

  <button type="button"
          class="apply-button"
          th:attr="data-recruitment-id=${job.recruitmentIdx}"
          sec:authorize="hasAuthority('ROLE_USER')"
          onclick="checkAndGoApply(this)">
    지원하기
  </button>

  <button type="button"
          onclick="goBackWithRefreshParam()">
    목록보기
  </button>

</div>

<div th:replace="include/footer :: footer"></div>

<!-- JS는 body 끝에 넣기 -->
<script>
  function toggleBookmark(button) {
    if (!isLogin) {
      alert('로그인 후 이용해 주세요.');
      location.href = '/user/login';
      return;
    }

    const recruitmentId = button.getAttribute("data-id");
    const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute("content");
    const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute("content");

    fetch('/favorite/toggle', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
        [csrfHeader]: csrfToken
      },
      body: new URLSearchParams({ recruitmentId })
    })
    .then(response => response.text())
    .then(result => {
      const icon = button.querySelector('i');
      icon.classList.remove('fa-regular', 'fa-solid');

      if (result === 'favorited') {
        icon.classList.add('fa-solid');
        button.classList.add('active');
        button.title = '스크랩됨';
      } else {
        icon.classList.add('fa-regular');
        button.classList.remove('active');
        button.title = '스크랩';
      }
    })
    .catch(err => {
      console.error('스크랩 처리 중 오류:', err);
      alert('스크랩 처리 중 오류가 발생했습니다.');
    });
  }
</script>

<script>
  function checkAndGoApply(button) {
    const recruitmentId = button.getAttribute("data-recruitment-id");

    fetch(`/mypage/check-applied?recruitmentIdx=${recruitmentId}`)
      .then(response => response.json())
      .then(isApplied => {
        if (isApplied) {
          alert("이미 지원한 공고입니다. 중복 지원은 불가능합니다.");
        } else {
          // 이력서 선택 페이지로 이동
          location.href = `/mypage/choice_list/${recruitmentId}`;
        }
      })
      .catch(err => {
        console.error("지원 여부 확인 실패:", err);
        alert("지원 여부 확인 중 오류가 발생했습니다.");
      });
  }
</script>

</body>
</html>
