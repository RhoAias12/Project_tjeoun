<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<!-- 📌 scrapSort + deadlineSort 모두 받음 -->
<div th:fragment="fragment (jobPage, startPage, endPage, url, scrapSort, deadlineSort)"
     class="pagination">
  <ul class="pagination-list">

    <!-- ◀ 이전 페이지 -->
    <li th:if="${jobPage.number > 0}">
      <a class="page-btn"
         th:href="@{${url}(page=${jobPage.number}, scrapSort=${scrapSort}, deadlineSort=${deadlineSort})}">〈</a>
    </li>

    <!-- 🔢 페이지 번호 -->
    <li th:if="${endPage >= startPage}"
        th:each="i : ${#numbers.sequence(startPage + 1, endPage + 1)}">
      <a class="page-btn"
         th:href="@{${url}(page=${i}, scrapSort=${scrapSort}, deadlineSort=${deadlineSort})}"
         th:classappend="${i} == ${jobPage.number + 1} ? ' active' : ''"
         th:text="${i}">1</a>
    </li>

    <!-- ▶ 다음 페이지 -->
    <li th:if="${jobPage.number < jobPage.totalPages - 1}">
      <a class="page-btn"
         th:href="@{${url}(page=${jobPage.number + 2}, scrapSort=${scrapSort}, deadlineSort=${deadlineSort})}">〉</a>
    </li>

  </ul>
</div>

</body>
</html>
