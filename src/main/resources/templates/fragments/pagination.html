<!-- pagination.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<!-- 🔽 페이징 프래그먼트 -->
<div th:fragment="fragment (jobPage, startPage, endPage, url, customSort)"
     th:if="${jobPage.totalPages > 1}" class="pagination">
  <ul class="pagination-list">

    <!-- « 이전 -->
    <li th:if="${jobPage.number > 0}">
      <a class="page-btn"
         th:href="@{${url}(page=${jobPage.number - 1}, customSort=${customSort})}">〈</a>
    </li>

    <!-- 페이지 번호 -->
    <li th:each="i : ${#numbers.sequence(startPage, endPage)}">
      <a class="page-btn"
         th:href="@{${url}(page=${i+1}, customSort=${customSort})}"
         th:classappend="${i+1} == ${jobPage.number} ? ' active' : ''"
         th:text="${i + 1}">
      </a>
    </li>


    <!-- » 다음 -->
    <li th:if="${jobPage.number < jobPage.totalPages - 1}">
      <a class="page-btn"
         th:href="@{${url}(page=${jobPage.number + 1}, customSort=${customSort})}">〉</a>
    </li>

  </ul>
</div>

</body>
</html>
