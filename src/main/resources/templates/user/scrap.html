<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/scrap.css}" />
    <!-- Font Awesome 아이콘 추가 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <title>스크랩</title>

    <script>
      function toggleBookmark(element) {
        element.classList.toggle('fa-regular');
        element.classList.toggle('fa-solid');
        element.classList.toggle('active');
      }
    </script>
  </head>
  <body>
    <!-- 헤더 -->
    <div th:replace="include/header :: header"></div>

    <!-- 전체 컨테이너 -->
    <div class="tab-box">
      <div class="tab-inner">
        <h2 class="mypage-title">마이페이지</h2>

        <!-- 탭 버튼 -->
        <div class="tab-buttons">
          <button class="tab">회원정보수정</button>
          <button class="tab">이력서관리</button>
          <button class="tab">지원현황</button>
          <button class="tab1">스크랩</button>
        </div>

        <div class="apply-list">
          <div class="apply-card">
            <div class="apply-info">
              <div class="job-title">공고명</div>
              <div class="company-name">회사명</div>
            </div>
            <div class="apply-side">
              <span class="deadline">마감일<br />2025.06.28</span>
              <div class="apply-action">
                <i
                        class="fa-regular fa-bookmark bookmark-icon"
                        onclick="toggleBookmark(this)"
                ></i>
                <button class="apply-btn">지원하기</button>
              </div>
            </div>
          </div>

          <div class="apply-card">
            <div class="apply-info">
              <div class="job-title">공고명</div>
              <div class="company-name">회사명</div>
            </div>
            <div class="apply-side">
              <span class="deadline">마감일<br />2025.07.25</span>
              <div class="apply-action">
                <i
                        class="fa-regular fa-bookmark bookmark-icon"
                        onclick="toggleBookmark(this)"
                ></i>
                <button class="apply-btn">지원하기</button>
              </div>
            </div>
          </div>

          <div class="apply-card">
            <div class="apply-info">
              <div class="job-title">공고명</div>
              <div class="company-name">회사명</div>
            </div>
            <div class="apply-side">
              <span class="deadline">마감일<br />2025.07.29</span>
              <div class="apply-action">
                <i
                        class="fa-regular fa-bookmark bookmark-icon"
                        onclick="toggleBookmark(this)"
                ></i>
                <button class="apply-btn">지원하기</button>
              </div>
            </div>
          </div>

          <div class="apply-card">
            <div class="apply-info">
              <div class="job-title">공고명</div>
              <div class="company-name">회사명</div>
            </div>
            <div class="apply-side">
              <span class="deadline">마감일<br />2025.07.30</span>
              <div class="apply-action">
                <i
                        class="fa-regular fa-bookmark bookmark-icon"
                        onclick="toggleBookmark(this)"
                ></i>
                <button class="apply-btn">지원하기</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 페이지네이션 -->
        <div class="pagination">
          <ul class="pagination-list">
            <li><a href="#" class="page-btn">〈</a></li>
            <li><a href="#" class="page-btn active">1</a></li>
            <li><a href="#" class="page-btn">2</a></li>
            <li><a href="#" class="page-btn">3</a></li>
            <li><a href="#" class="page-btn">4</a></li>
            <li><a href="#" class="page-btn">5</a></li>
            <li><a href="#" class="page-btn">〉</a></li>
          </ul>
        </div>
      </div>
    </div>

    <!-- 푸터 -->
    <div th:replace="include/footer :: footer"></div>
  </body>
</html>
