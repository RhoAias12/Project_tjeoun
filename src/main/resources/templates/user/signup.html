<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>회원가입</title>
  <link rel="stylesheet" href="/css/signup.css" />
</head>
<body>

<div class="signup-container">
  <h2>회원가입</h2>

  <form th:action="@{/user/signup}" method="post" th:object="${userFormDto}" onsubmit="return validatePasswordMatch()" class="signup-form">

    <input type="text" th:field="*{userName}" placeholder="이름" required />

    <div class="input-wrapper">
      <input type="email" th:field="*{userEmail}" id="userEmail" placeholder="이메일" required />
      <button type="button" class="check-btn" onclick="checkEmail()">중복확인</button>
    </div>

    <div class="input-wrapper">
      <input type="text" th:field="*{userNickname}" id="userNickname" placeholder="닉네임" required />
      <button type="button" class="check-btn" onclick="checkNickname()">중복확인</button>
    </div>

    <input type="password" th:field="*{userPassword}" id="userPassword" placeholder="비밀번호" required />
    <input type="password" id="confirmPassword" placeholder="비밀번호 확인" required />

    <input type="date" th:field="*{userBirth}" placeholder="생년월일" required />

    <button type="submit">회원가입</button>

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
  </form>
</div>

</body>
</html>
