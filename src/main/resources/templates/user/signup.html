<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" th:href="@{/css/header.css}" />
  <link rel="stylesheet" th:href="@{/css/signup.css}" />
  <title>회원가입</title>
  <style>
    .fieldError {
      color: blue;
      font-size: 0.9em;
      margin-top: 2px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
<div th:replace="include/header :: header"></div>

<div class="signup-container">
  <h2>회원가입</h2>
  <form th:action="@{/user/signup}" method="post" th:object="${userFormDto}"
        onsubmit="return validateForm()" class="signup-form" novalidate>

    <!-- 이름 -->
    <input type="text" th:field="*{userName}" placeholder="이름" />
    <p th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}" class="fieldError"></p>

    <!-- 이메일 -->
    <div class="input-wrapper">
      <input type="email" th:field="*{userEmail}" id="userEmail" placeholder="이메일" />
      <button type="button" class="check-btn" onclick="checkEmail()">중복확인</button>
    </div>
    <p th:if="${#fields.hasErrors('userEmail')}" th:errors="*{userEmail}" class="fieldError"></p>
    <p id="emailMessage" class="fieldError"></p>

    <!-- 닉네임 -->
    <div class="input-wrapper">
      <input type="text" th:field="*{userNickname}" id="userNickname" placeholder="닉네임" />
      <button type="button" class="check-btn" onclick="checkNickname()">중복확인</button>
    </div>
    <p th:if="${#fields.hasErrors('userNickname')}" th:errors="*{userNickname}" class="fieldError"></p>
    <p id="nicknameMessage" class="fieldError"></p>

    <!-- 비밀번호 -->
    <input type="password" th:field="*{userPassword}" id="userPassword" placeholder="비밀번호" />
    <p th:if="${#fields.hasErrors('userPassword')}" th:errors="*{userPassword}" class="fieldError"></p>

    <!-- 비밀번호 확인 -->
    <input type="password" id="confirmPassword" placeholder="비밀번호 확인" />

    <!-- 생년월일 -->
    <input type="date" th:field="*{userBirth}" placeholder="생년월일" />
    <p th:if="${#fields.hasErrors('userBirth')}" th:errors="*{userBirth}" class="fieldError"></p>

    <button type="submit">회원가입</button>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
  </form>
</div>

<script>
  let emailChecked = false;
  let nicknameChecked = false;

  async function checkEmail() {
    const email = document.getElementById("userEmail").value.trim();
    const msg = document.getElementById("emailMessage");

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


    if (!email) {
        msg.textContent = "이메일을 입력해주세요.";
        emailChecked = false;
        return;
    }
     if (!emailRegex.test(email)) {
        msg.style.color = "blue";
        msg.textContent = "이메일 형식에 맞게 입력해 주세요.";
        emailChecked = false;
        return;
      }

    const res = await fetch(`/api/user/check-email?email=${encodeURIComponent(email)}`);
    const data = await res.json();
    if (data.exists) {
      msg.textContent = "이미 존재하는 이메일입니다.";
      emailChecked = false;
    } else {
      msg.textContent = "사용 가능한 이메일입니다.";
      emailChecked = true;
    }
  }

  async function checkNickname() {
    const nickname = document.getElementById("userNickname").value.trim();
    const msg = document.getElementById("nicknameMessage");
    if (!nickname) {
      msg.textContent = "닉네임을 입력해주세요.";
      nicknameChecked = false;
      return;
    }
    if (nickname.length < 2 || nickname.length > 20) {
      msg.style.color = "blue";
      msg.textContent = "닉네임은 2~20글자 사이여야 합니다.";
      nicknameChecked = false;
      return;
    }
    const res = await fetch(`/api/user/check-nickname?nickname=${encodeURIComponent(nickname)}`);
    const data = await res.json();
    if (data.exists) {
      msg.textContent = "이미 존재하는 닉네임입니다.";
      nicknameChecked = false;
    } else {
      msg.textContent = "사용 가능한 닉네임입니다.";
      nicknameChecked = true;
    }
  }

  function validateForm() {
    const pw = document.getElementById("userPassword").value;
    const pwConfirm = document.getElementById("confirmPassword").value;

    if (!emailChecked) {
      alert("이메일 중복 확인을 해주세요.");
      return false;
    }
    if (!nicknameChecked) {
      alert("닉네임 중복 확인을 해주세요.");
      return false;
    }
    if (pw !== pwConfirm) {
      alert("비밀번호가 일치하지 않습니다.");
      return false;
    }
    return true;
  }
</script>
</body>
</html>
