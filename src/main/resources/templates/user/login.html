<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" th:href="@{/css/header.css}" />
  <link rel="stylesheet" th:href="@{/css/login.css}" />
  <title>로그인</title>
</head>
<body>
<div th:replace="include/header :: header"></div>

<div class="signup-container">
  <p>로그인</p>

  <form th:action="@{/user/login}" method="post" class="signup-form">
    <input type="email" name="userEmail" placeholder="이메일" autocomplete="username" required />
    <input type="password" name="password" placeholder="비밀번호" autocomplete="current-password" required />

    <p th:if="${loginErrorMsg}" th:text="${loginErrorMsg}" class="fieldError"></p>

    <div class="search">
      <a href="#">아이디 찾기</a> | <a href="#">비밀번호 찾기</a>
    </div>
    <div class="button-group">
      <button type="submit">로그인</button>
      <button type="button" onclick="location.href='/user/signup'">회원가입</button>
    </div>

    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
  </form>
</div>
</body>
</html>
