<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>메인페이지</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/chat.css}" />

<!--    <script defer th:src="@{/js/main.js}"></script>-->

    <script>
      //chat 챗봇
  function toggleChat() {
    const popup = document.getElementById("chatPopup");
    popup.style.display = (popup.style.display === "block") ? "none" : "block";
    }

    async function sendMessage() {
    const inputEl = document.getElementById("userInput");
    const message = inputEl.value.trim();
    if (!message) return;

    const chatBox = document.getElementById("chatBox");

    // 유저 메시지 추가
    const userMsg = document.createElement("div");
    userMsg.className = "message user-message";
    userMsg.textContent = message;
    chatBox.appendChild(userMsg);

    inputEl.value = "";

    try {
    const response = await fetch("/api/chat", {
       method: "POST",
       headers: { "Content-Type": "application/json" },
       body: JSON.stringify({ input: message }),
    });

    if (!response.ok) {
     const errorText = await response.text();
     console.error("서버 오류:", errorText);

     // ❌ 에러도 챗봇 메시지로 표시
     const botMsg = document.createElement("div");
     botMsg.className = "message bot-message error-message";
     botMsg.textContent = "❌ 서버 오류가 발생했어요.\n" + errorText;
     chatBox.appendChild(botMsg);

     chatBox.scrollTop = chatBox.scrollHeight;
     return;
    }

    const data = await response.json();

    const botMsg = document.createElement("div");
    botMsg.className = "message bot-message";
    botMsg.textContent = data.reply;
    chatBox.appendChild(botMsg);

    chatBox.scrollTop = chatBox.scrollHeight;

    } catch (error) {
      console.error("요청 실패:", error);

    // ❌ 네트워크 에러도 챗봇 메시지로 표시
    const botMsg = document.createElement("div");
    botMsg.className = "message bot-message error-message";
    botMsg.textContent = "❌ 요청 실패: " + error;
    chatBox.appendChild(botMsg);

    chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    // 엔터 키로 전송
    document.addEventListener("DOMContentLoaded", () => {
      const inputEl = document.getElementById("userInput");
      inputEl.addEventListener("keydown", function(event) {
         if (event.key === "Enter" && !event.shiftKey) {
           event.preventDefault();
           sendMessage();
      }
    });
  });



    </script>
  </head>
  <body>
  <div th:replace="include/header :: header"></div>


  <main class="main-hero-section">
      <div class="background-layer"></div>

      <div class="hero-overlay">
        <h1 class="hero-text">승리는 가장 끈기 있는 자에게 돌아간다.</h1>
      </div>
    </main>

  <!-- chat.html -->
  <!-- 채팅 토글 버튼 -->
  <div class="chat-toggle-button" onclick="toggleChat()">💬</div>

  <!-- 채팅 팝업 -->
  <div class="chat-popup" id="chatPopup">
    <div class="chat-header">
      <span class="chat-title">AI Chat</span>
      <button class="close-btn" onclick="toggleChat()">✖️</button>
    </div>

    <!-- 메시지 영역 -->
    <div class="chat-box" id="chatBox">
      <!-- 여기에 메시지들이 들어감 -->
    </div>

    <!-- 입력창은 형제로 따로! -->
    <div class="input-box">
      <input type="text" id="userInput" placeholder="메시지를 입력하세요..." />
      <button onclick="sendMessage()">전송</button>
    </div>
  </div>

  <div th:replace="include/footer :: footer"></div>
  </body>
</html>
