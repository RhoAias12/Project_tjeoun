<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>메인페이지</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/chat.css}" />

<!--    <script defer th:src="@{/js/main.js}"></script>-->

    <script>
      function toggleChat() {
        const popup = document.getElementById("chatPopup");
        popup.style.display = (popup.style.display === "block") ? "none" : "block";
      }

      async function sendMessage() {
        const inputEl = document.getElementById("userInput");
        const message = inputEl.value.trim();
        if (!message) return;

        const chatBox = document.getElementById("chatBox");

        // 유저 메시지 추가
        const userMsg = document.createElement("div");
        userMsg.className = "message user-message";
        userMsg.textContent = message;
        chatBox.appendChild(userMsg);

        inputEl.value = "";

        // 작성중 메시지 추가
        const botMsg = document.createElement("div");
        botMsg.className = "message bot-message";
        botMsg.textContent = "... 작성중입니다";
        chatBox.appendChild(botMsg);
        chatBox.scrollTop = chatBox.scrollHeight;

        // ✅ CSRF 토큰 읽어오기
        const csrfToken = document.querySelector("meta[name='_csrf']").getAttribute("content");
        const csrfHeader = document.querySelector("meta[name='_csrf_header']").getAttribute("content");

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              [csrfHeader]: csrfToken,  // ✅ CSRF 토큰 동적 헤더 적용
            },
            body: JSON.stringify({ input: message }),
          });

          if (!response.ok) {
            const errorText = await response.text();
            console.error("서버 오류:", errorText);
            botMsg.classList.add("error-message");
            botMsg.textContent = "❌ 서버 오류가 발생했어요.\n" + errorText;
            chatBox.scrollTop = chatBox.scrollHeight;
            return;
          }

          const data = await response.json();
          botMsg.textContent = data.reply;
          chatBox.scrollTop = chatBox.scrollHeight;

        } catch (error) {
          console.error("요청 실패:", error);
          botMsg.classList.add("error-message");
          botMsg.textContent = "❌ 요청 실패: " + error;
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      }

      // 엔터 키 전송
      document.addEventListener("DOMContentLoaded", () => {
        const inputEl = document.getElementById("userInput");
        inputEl.addEventListener("keydown", function(event) {
          if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
          }
        });
      });
    </script>

  </head>
  <body>
  <div th:replace="include/header :: header"></div>


  <main class="main-hero-section">
      <div class="background-layer"></div>

      <div class="hero-overlay">
        <h1 class="hero-text">승리는 가장 끈기 있는 자에게 돌아간다.</h1>
      </div>
    </main>

  <!-- chat.html -->
  <!-- 채팅 토글 버튼 -->
  <div class="chat-toggle-button" onclick="toggleChat()">💬</div>

  <!-- 채팅 팝업 -->
  <div class="chat-popup" id="chatPopup">
    <div class="chat-header">
      <span class="chat-title">AI Chat</span>
      <button class="close-btn" onclick="toggleChat()">✖️</button>
    </div>

    <!-- 메시지 영역 -->
    <div class="chat-box" id="chatBox">
      <!-- 여기에 메시지들이 들어감 -->
    </div>

    <!-- 입력창은 형제로 따로! -->
    <div class="input-box">
      <input type="text" id="userInput" placeholder="메시지를 입력하세요..." />
      <button onclick="sendMessage()">전송</button>
    </div>
  </div>

  <div th:replace="include/footer :: footer"></div>
  </body>
</html>
