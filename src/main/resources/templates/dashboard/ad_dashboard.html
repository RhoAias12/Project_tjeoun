<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 대시보드</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- ✅ CSS -->
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/ad_dashboard.css}" />
</head>
<body>

<!-- 헤더 -->
<div th:replace="include/header :: header"></div>

<!-- 메인 대시보드 컨테이너 -->
<div class="dashboard-container">

    <h2>관리자 대시보드</h2>

    <!-- 요약 지표 (수정됨) -->
    <div class="metric-boxes">
        <div class="metric">
            <div>총 공고 수</div>
            <div th:text="${dashboard.totalJobCount}">0</div>
        </div>
        <div class="metric">
            <div>전체 사용자 수</div>
            <div th:text="${dashboard.totalUserCount}">0</div>
        </div>
        <div class="metric">
            <div>전체 지원 수</div>
            <div th:text="${dashboard.totalApplyCount}">0</div>
        </div>
    </div>


    <div class="chart-section">
        <div class="chart-container">
            <h3>회원 연령대 분포</h3>
            <canvas id="ageGroupChart" width="400" height="400"></canvas>
        </div>

        <div class="chart-container">
            <h3>최근 7일 검색 키워드 TOP 5</h3>
            <canvas id="keywordChart"></canvas>
        </div>

        <div class="chart-container">
            <h3>인기 직무 TOP 5</h3>
            <canvas id="roleChart"></canvas>
        </div>

    </div>

</div>


<!-- 푸터 -->
<div th:replace="include/footer :: footer"></div>

<!-- ✅ 차트 스크립트 -->
<script th:inline="javascript">
    const keywordLabels = [[${dashboard.topKeywordLabels}]];
    const keywordCounts = [[${dashboard.topKeywordCounts}]];
    const roleLabels = [[${dashboard.popularRoles}]];
    const roleCounts = [[${dashboard.popularRoleCounts}]];

    new Chart(document.getElementById("keywordChart"), {
      type: 'bar',
      data: {
        labels: keywordLabels,
        datasets: [{
          label: '검색 횟수',
          data: keywordCounts,
          backgroundColor: 'rgba(54, 162, 235, 0.6)'
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } }
      }
    });

    new Chart(document.getElementById("roleChart"), {
      type: 'bar',
      data: {
        labels: roleLabels,
        datasets: [{
          label: '공고 수',
          data: roleCounts,
          backgroundColor: 'rgba(255, 159, 64, 0.6)'
        }]
      },
      options: {
        responsive: true,
        plugins: { legend: { display: false } }
      }
    });

    // 연령대 차트 데이터
  const ageGroupLabels = [[${dashboard.ageGroupLabels}]];
  const ageGroupCounts = [[${dashboard.ageGroupCounts}]];

  const ctx = document.getElementById('ageGroupChart').getContext('2d');
  new Chart(ctx, {
    type: 'pie',
    data: {
      labels: ageGroupLabels,
      datasets: [{
        label: '회원 수',
        data: ageGroupCounts,
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {
          position: 'bottom'
        },
        title: {
          display: true,
        }
      }
    }
  });
</script>

</body>
</html>
