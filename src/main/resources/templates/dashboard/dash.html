<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>취업 시장 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" th:href="@{/css/dashboard.css}" />
</head>
<body>
<div class="dashboard-container">
  <h1>📊 취업 시장 현황 대시보드</h1>

  <div class="metric-boxes">
    <div class="metric">총 공고 수: <strong th:text="${totalJobCount}"></strong>건</div>
    <div class="metric">마감 임박 공고 수: <strong th:text="${closingSoonCount}"></strong>건</div>
  </div>

  <div class="chart-section">
    <h3>🔥 인기 직무 TOP 5</h3>
    <ul>
      <li th:each="pos : ${topJobs}" th:text="${pos.name + ' (' + pos.count + '건)'}"></li>
    </ul>
  </div>

  <div class="chart-section">
    <h3>🧪 인기 기술 스택</h3>
    <ul>
      <li th:each="stack : ${popularStacks}" th:text="${stack}"></li>
    </ul>
  </div>

  <div class="chart-section">
    <h3>📍 지역별 공고 분포</h3>
    <canvas id="regionChart"></canvas>
  </div>

  <div class="chart-section">
    <h3>🕒 최근 한 달간 공고 트렌드</h3>
    <canvas id="trendChart"></canvas>
  </div>
</div>

<script th:inline="javascript">
  const regionLabels = /*[[${regionDistribution.keySet()}]]*/ [];
  const regionData = /*[[${regionDistribution.values()}]]*/ [];

  const trendLabels = /*[[${trendLabels}]]*/ [];
  const trendData = /*[[${trendData}]]*/ [];


  new Chart(document.getElementById('regionChart'), {
    type: 'bar',
    data: {
      labels: regionLabels,
      datasets: [{
        label: '지역별 공고 수',
        data: regionData,
        backgroundColor: 'rgba(75, 192, 192, 0.5)'
      }]
    },
    options: {
      responsive: true
    }
  });

  new Chart(document.getElementById('trendChart'), {
    type: 'line',
    data: {
      labels: trendLabels,
      datasets: [{
        label: '일별 공고 수',
        data: trendData,
        borderColor: 'rgba(255, 99, 132, 0.7)',
        fill: false,
        tension: 0.3
      }]
    },
    options: {
      responsive: true
    }
  });
</script>

</body>
</html>
