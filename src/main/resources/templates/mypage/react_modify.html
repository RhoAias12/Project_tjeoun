<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이력서 수정페이지</title>
      <link rel="stylesheet" th:href="@{/css/main.css}" />
      <link rel="stylesheet" th:href="@{/css/header.css}" />
      <link rel="stylesheet" th:href="@{/css/footer.css}" />
      <link rel="stylesheet" th:href="@{/css/react.css}" />
<!--    <script defer src="/js/main.js"></script>-->

      <script>
// 이미지
    document.addEventListener('DOMContentLoaded', function () {
    const imgUpload = document.getElementById('imgUpload');
    const imgPreview = document.getElementById('imgPreview');

    imgUpload.addEventListener('change', function () {
      const file = imgUpload.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          imgPreview.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    });
  });

function validateForm() {
  // 필수 필드 검사
  const titleEl = document.querySelector('textarea[name="title"]');
  const addressEl = document.querySelector('textarea[name="address"]');
  const phoneNumEl = document.querySelector('textarea[name="phoneNum"]');

  if (!titleEl.value.trim()) {
    alert('제목을 작성해 주세요!');
    titleEl.classList.add('required-field');
    return false;
  }
  if (!addressEl.value.trim()) {
    alert('주소를 작성해 주세요!');
    addressEl.classList.add('required-field');
    return false;
  }
  if (!phoneNumEl.value.trim()) {
    alert('전화번호를 작성해 주세요!');
    phoneNumEl.classList.add('required-field');
    return false;
  }

  // 질문/답변 쌍 검사: 질문1~n
  const questionEls = document.querySelectorAll('textarea[name^="resumeContents"][name$=".question"]');
  const contextEls = document.querySelectorAll('textarea[name^="resumeContents"][name$=".context"]');

  for (let i = 0; i < questionEls.length; i++) {
    const question = questionEls[i].value.trim();
    const context = contextEls[i].value.trim();

    if (question && !context) {
      alert(`질문 ${i + 1}에 대한 답변을 작성해 주세요!`);
      contextEls[i].classList.add('required-field');
      contextEls[i].focus();
      return false;
    }
    if (!question && context) {
      alert(`질문 ${i + 1}이 비어있습니다. 질문을 작성해 주세요!`);
      questionEls[i].classList.add('required-field');
      questionEls[i].focus();
      return false;
    }
  }

  return true;
}

    function checkTitleLength(textarea) {
    const maxLength = 45;
    if (textarea.value.length > maxLength) {
        alert("제목은 45글자 이내입니다.");
        textarea.value = textarea.value.slice(0, maxLength);
    }
}

  </script>
  </head>
  <body>
    <div th:replace="include/header :: header"></div>
    <div class="page-title">
        <p>마이페이지 &gt; 이력서</p>
    </div>
    <div class="container">
        <form th:action="@{/mypage/react_modify/{id}(id=${resume.resumeIdx})}" method="post" enctype="multipart/form-data" onsubmit="return validateForm()">
        <input type="hidden" name="page" th:value="${page}" />
            <table class="resume-table">
                <!-- 첫 줄: 이미지 텍스트 -->
                <tr>
                    <th scope="row">* 제목</th>
                    <td class="centered-cell">
                        <div class="form-group">
            <textarea
                    name="title"
                    id="title"
                    class="short-text"
                    maxlength="45"
                    placeholder="제목을 입력해 주세요."
                    oninput="checkTitleLength(this)"
                    th:text="${resume.title}"></textarea>
                        </div>
                    </td>
                </tr>
                <tr>
                    <th style="text-align: center;">
                        <label for="imgUpload" class="logo-label"></label>
                        <input type="file" id="imgUpload" name="imgFile" accept="image/*" />
                        <div>
                            <img id="imgPreview"
                                 class="img"
                                 th:if="${resume.img != null}"
                                 th:src="@{${resume.img}}"
                                 alt="이미지 미리보기" />
                            <p th:if="${resume.img == null}">이미지가 없습니다.</p>
                        </div>
                    </th>

                    <!-- 오른쪽: 개인정보 입력 -->
                    <td>
                        <div class="form-group">
                            <label>이름</label>
                            <textarea name="userName" class="short-text"
                                      th:text="${resume.user.userName}"></textarea>
                        </div>

                        <div class="form-group">
                            <label>이메일</label>
                            <textarea name="userEmail" class="short-text"
                                      th:text="${resume.user.userEmail}"></textarea>
                        </div>

                        <div class="form-group">
                            <label>생년월일</label>
                            <textarea name="userBirth" class="short-text"
                                      th:text="${#temporals.format(resume.user.userBirth, 'yyyy-MM-dd')}"></textarea>
                        </div>

                        <div class="form-group">
                            <label>* 주소</label>
                            <textarea
                                    name="address"
                                    class="short-text"
                                    th:text="${resume.address}"
                                    placeholder="주소를 입력해 주세요.">

                            </textarea>
                        </div>

                        <div class="form-group">
                            <label>* 전화번호</label>
                            <textarea
                                    name="phoneNum"
                                    class="short-text"
                                    th:text="${resume.phoneNum}"
                                    placeholder="전화번호를 입력해 주세요. ex. 010-0000-0000">

                            </textarea>
                        </div>

                        <div class="form-group">
                            <label>학력</label>
                            <textarea
                                    name="education"
                                    class="short-text"
                                    th:text="${resume.education}"
                                    placeholder="학력을 입력해 주세요.">

                            </textarea>
                        </div>

                        <div class="form-group">
                            <label>자격증 및 스킬</label>
                            <textarea
                                    name="ability"
                                    class="short-text1"
                                    th:text="${resume.ability}"
                                    placeholder="자격증 및 스킬을 입력해 주세요.">

                            </textarea>
                        </div>

                        <div class="form-group">
                            <label>경력</label>
                            <textarea
                                    name="antecedents"
                                    class="short-text1"
                                    th:text="${resume.antecedents}"
                                    placeholder="경력을 입력해 주세요.">

                            </textarea>
                        </div>

                        <div class="form-group">
                            <label>수상이력</label>
                            <textarea
                                    name="awards"
                                    class="short-text1"
                                    th:text="${resume.awards}"
                                    placeholder="수상이력을 입력해 주세요.">

                            </textarea>
                        </div>
                    </td>
                </tr>

                <tr th:each="content, iterStat : ${resume.resumeContents}">
                    <th>
                        <div class="question">
                            <textarea
                                    th:name="'resumeContents[' + ${iterStat.index} + '].question'"
                                    class="question-textarea"
                                    th:text="${content.question}"
                                    placeholder="질문을 입력하세요."></textarea>
                        </div>
                    </th>
                    <td>
        <textarea
                th:name="'resumeContents[' + ${iterStat.index} + '].context'"
                class="answer-textarea"
                th:text="${content.context}"
                placeholder="답변을 입력하세요."></textarea>
                    </td>
                </tr>


                <tr>
                    <th class="link">포트폴리오 링크</th>
                    <td>
            <textarea name="context" placeholder="예: https://github.com/yourname/portfolio"
                      th:text="${resume.context}"></textarea>
                    </td>
                </tr>
            </table>

                <div class="button-group">
                    <button type="button"
                            th:onclick="|location.href='@{/mypage/react_detail/{id}(id=${resume.resumeIdx})}?page=${page}'|">
                        취소
                    </button>
                    <button type="submit">수정 완료</button>
                </div>

        </form>
    </div>
    <div th:replace="include/footer :: footer"></div>
  </body>
</html>
