<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이력서 수정페이지</title>
      <link rel="stylesheet" th:href="@{/css/main.css}" />
      <link rel="stylesheet" th:href="@{/css/header.css}" />
      <link rel="stylesheet" th:href="@{/css/footer.css}" />
      <link rel="stylesheet" th:href="@{/css/react.css}" />
    <script defer src="../../../../../../final_project/front/js/main.js"></script>
  </head>
  <body>
    <div th:replace="include/header :: header"></div>
    <div class="page-title">
        <p>마이페이지 &gt; 이력서</p>
    </div>
    <div class="container">
        <form th:action="@{/mypage/react_modify/{id}(id=${resume.resumeIdx})}" method="post" enctype="multipart/form-data">
            <table class="resume-table">
                <!-- 첫 줄: 이미지 텍스트 -->
                <!-- 제목 입력 필드 -->
                <tr>
                    <th>제목</th>
                    <td>
                        <input type="text" name="title" th:value="${resume.title}" placeholder="제목을 입력하세요" />
                    </td>
                </tr>

                <!-- 내용 입력 필드 -->
                <tr>
                    <th>이력서 내용</th>
                    <td>
                        <textarea name="context" th:value="${resume.context}" placeholder="이력서를 입력하세요"></textarea>
                    </td>
                </tr>

                <!-- 주소 입력 필드 -->
                <tr>
                    <th>주소</th>
                    <td>
                        <textarea name="address" th:value="${resume.address}" placeholder="주소를 입력하세요"></textarea>
                    </td>
                </tr>

                <!-- 전화번호 입력 필드 -->
                <tr>
                    <th>전화번호</th>
                    <td>
                        <textarea name="phoneNum" th:value="${resume.phoneNum}" placeholder="전화번호를 입력하세요"></textarea>
                    </td>
                </tr>

                <!-- 학력 입력 필드 -->
                <tr>
                    <th>학력</th>
                    <td>
                        <textarea name="education" th:value="${resume.education}" placeholder="학력을 입력하세요"></textarea>
                    </td>
                </tr>

                <!-- 이미지 업로드 -->
                <tr>
                    <th>이미지</th>
                    <td>
                        <input type="file" name="img" />
                    </td>
                </tr>
            </table>
        </form>
    </div>
    <div class="button-group">
        <button type="submit">수정</button>
        <button type="button" onclick="location.href='/mypage/react_list'">취소</button>
    </div>
    <div th:replace="include/footer :: footer"></div>
  </body>
</html>
