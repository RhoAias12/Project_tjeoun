<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이력서 수정페이지</title>
      <link rel="stylesheet" th:href="@{/css/main.css}" />
      <link rel="stylesheet" th:href="@{/css/header.css}" />
      <link rel="stylesheet" th:href="@{/css/footer.css}" />
      <link rel="stylesheet" th:href="@{/css/react.css}" />
<!--    <script defer src="/js/main.js"></script>-->

      <script>
          function validateForm() {
  // 대상 요소 가져오기
  const titleEl = document.querySelector('textarea[name="title"]');
  const addressEl = document.querySelector('textarea[name="address"]');
  const phoneNumEl = document.querySelector('textarea[name="phoneNum"]');
  const question1El = document.querySelector('textarea[name="resumeContents[0].question"]');
  const context1El = document.querySelector('textarea[name="resumeContents[0].context"]');

  // 검사: 빈 항목 있으면 즉시 중단
  if (!titleEl.value.trim()) {
    alert('제목을 작성해 주세요!');
    titleEl.classList.add('required-field');
    return false;
  }
  if (!addressEl.value.trim()) {
    alert('주소를 작성해 주세요!');
    addressEl.classList.add('required-field');
    return false;
  }
  if (!phoneNumEl.value.trim()) {
    alert('전화번호를 작성해 주세요!');
    phoneNumEl.classList.add('required-field');
    return false;
  }
  if (!question1El.value.trim()) {
    alert('질문 1을 작성해 주세요!');
    question1El.classList.add('required-field');
    return false;
  }
  if (!context1El.value.trim()) {
    alert('답변 1을 작성해 주세요!');
    context1El.classList.add('required-field');
    return false;
  }

  return true; // 모두 통과 시에만 제출 허용
}

      </script>

  </head>
  <body>
    <div th:replace="include/header :: header"></div>
    <div class="page-title">
        <p>마이페이지 &gt; 이력서</p>
    </div>
    <div class="container">
        <form th:action="@{/mypage/react_modify/{id}(id=${resume.resumeIdx})}"
              method="post"
              enctype="multipart/form-data"
              onsubmit="return validateForm()">
            <table class="resume-table">
                <!-- 첫 줄: 이미지 텍스트 -->
                <tr>
                    <th scope="row">제목</th>
                    <td class="centered-cell">
                        <div class="form-group">
                            <textarea name="title" class="short-text" th:text="${resume.title}"></textarea>
                        </div>
                    </td>
                </tr>
                <tr>
                    <th style="text-align: center;">
                        <img id="preview" th:src="@{${resume.img}}" alt="미리보기 없음" />
                        <input type="file" name="imgFile" accept="image/*" />
                    </th>

                    <!-- 오른쪽: 개인정보 입력 -->
                    <td>
                        <div class="form-group">
                            <label>이름</label>
                            <textarea name="userName" class="short-text"
                                      th:text="${resume.user.userName}"></textarea>
                        </div>

                        <div class="form-group">
                            <label>이메일</label>
                            <textarea name="userEmail" class="short-text"
                                      th:text="${resume.user.userEmail}"></textarea>
                        </div>

                        <div class="form-group">
                            <label>생년월일</label>
                            <textarea name="userBirth" class="short-text"
                                      th:text="${#temporals.format(resume.user.userBirth, 'yyyy-MM-dd')}"></textarea>
                        </div>

                        <div class="form-group">
                            <label>주소</label>
                            <textarea name="address" class="short-text"
                                      th:text="${resume.address}"></textarea>
                        </div>

                        <div class="form-group">
                            <label>전화번호</label>
                            <textarea name="phoneNum" class="short-text"
                                      th:text="${resume.phoneNum}"></textarea>
                        </div>

                        <div class="form-group">
                            <label>학력</label>
                            <textarea name="education" class="short-text"
                                      th:text="${resume.education}"></textarea>
                        </div>

                        <div class="form-group">
                            <label>자격증 및 스킬</label>
                            <textarea name="ability" class="short-text1"
                                      th:text="${resume.ability}"></textarea>
                        </div>

                        <div class="form-group">
                            <label>경력</label>
                            <textarea name="antecedents" class="short-text1"
                                      th:text="${resume.antecedents}"></textarea>
                        </div>

                        <div class="form-group">
                            <label>수상이력</label>
                            <textarea name="awards" class="short-text1"
                                      th:text="${resume.awards}"></textarea>
                        </div>
                    </td>
                </tr>

                <tr th:each="content, iterStat : ${resume.resumeContents}">
                    <th>
                        <div class="question">
                            <p>질문[[${iterStat.count}]].</p>
                            <textarea name="resumeContents[[${iterStat.index}]].question"
                                      class="question-textarea" th:text="${content.question}"></textarea>
                        </div>
                    </th>
                    <td>
            <textarea name="resumeContents[[${iterStat.index}]].context"
                      class="answer-textarea" th:text="${content.context}"></textarea>
                    </td>
                </tr>

                <tr>
                    <th class="link">포트폴리오 링크</th>
                    <td>
            <textarea name="context" placeholder="예: https://github.com/yourname/portfolio"
                      th:text="${resume.context}"></textarea>
                    </td>
                </tr>
            </table>

                <div class="button-group">
                    <button type="button" th:onclick="|location.href='@{/mypage/react_list}'|">취소</button>
                    <button type="submit">수정 완료</button>
                </div>

        </form>
    </div>
    <div th:replace="include/footer :: footer"></div>
  </body>
</html>
