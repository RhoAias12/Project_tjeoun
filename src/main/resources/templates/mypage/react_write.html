<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이력서 작성</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/react.css}" />
<!--    <script defer src="/js/main.js"></script>-->

      <script>
          function validateForm() {
            const title = document.getElementById('title').value.trim();
            const address = document.getElementById('address').value.trim();
            const phoneNum = document.getElementById('phone_num').value.trim();
            const question1 = document.querySelector('textarea[name="resumeContents[0].question"]').value.trim();
            const context1 = document.querySelector('textarea[name="resumeContents[0].context"]').value.trim();

            if (!title) {
              alert('제목을 작성해 주세요!');
              return false;
            }
            if (!address) {
              alert('주소를 작성해 주세요!');
              return false;
            }
            if (!phoneNum) {
              alert('전화번호를 작성해 주세요!');
              return false;
            }
            if (!question1) {
              alert('질문 1을 작성해 주세요!');
              return false;
            }
            if (!context1) {
              alert('답변 1을 작성해 주세요!');
              return false;
            }
            for (let i = 0; i < 4; i++) {
              const questionEl = document.querySelector(`textarea[name="resumeContents[${i}].question"]`);
              const contextEl = document.querySelector(`textarea[name="resumeContents[${i}].context"]`);

              const question = questionEl.value.trim();
              const context = contextEl.value.trim();

              if (!question && context) {
                alert(`질문 ${i + 1}이 비어있습니다. 질문을 작성해 주세요!`);
                questionEl.focus();
                return false;
              }
              if (question && !context) {
                alert(`질문 ${i + 1}에 대한 답변을 작성해 주세요!`);
                contextEl.focus();
                return false;
              }
            }
            return true; // 통과 시 제출 허용
          }


    document.addEventListener('DOMContentLoaded', function () {
    const imageUpload = document.getElementById('imageUpload');
    const preview = document.getElementById('preview');

    imageUpload.addEventListener('change', function () {
      const file = imageUpload.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          preview.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    });
  });

    function checkTitleLength() {
    const titleInput = document.getElementById('title');
    if (titleInput.value.length > 45) {
      alert('제목은 60글자 이내입니다.');
      titleInput.value = titleInput.value.substring(0, 45);
    }
  }
      </script>

  </head>
  <body>
    <div th:replace="include/header :: header"></div>
    <div class="page-title">
      <p>마이페이지 &gt; 이력서</p>
    </div>
    <div class="container">
        <form method="post" th:action="@{/mypage/react_write}" enctype="multipart/form-data" onsubmit="return validateForm()">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <table class="resume-table">
                <!-- 첫 줄: 이미지 텍스트 -->
                <tr>
                    <th class="img">* 제목</th>
                    <td class="centered-cell">
                        <div class="form-group">
      <textarea
              id="title"
              name="title"
              class="short-text"
              placeholder="제목을 입력해 주세요."
              maxlength="45"
              oninput="checkTitleLength()"
      ></textarea>
                        </div>
                    </td>
                </tr>

                <!-- 둘째 줄: 왼쪽에 이미지 + 파일선택 / 오른쪽은 그대로 -->
                <tr>
                    <th style="text-align: center">
                        <!-- 작성 폼에서는 src 기본값 비워두기 -->
                        <img id="imgPreview"
                             class="img"
                             th:if="${formDto.img != null}"
                             th:src="@{${formDto.img}}"
                             alt="이미지 미리보기" />
                        <input type="file" id="imageUpload" name="imgFile" accept="image/*" />
                        <div id="fileName" style="margin-top: 4px"></div>
                    </th>
                    <!-- 오른쪽: 개인정보 입력 -->
                    <td>
                        <div class="form-group">
                            <label class="thick">이름</label>
                            <textarea readonly class="short-text" th:text="${user.userName}"></textarea>
                        </div>

                        <div class="form-group">
                            <label class="thick">이메일</label>
                            <textarea readonly class="short-text" th:text="${user.userEmail}"></textarea>
                        </div>

                        <div class="form-group">
                            <label class="thick">생년월일</label>
                            <textarea readonly class="short-text"
                                      th:text="${#temporals.format(user.userBirth, 'yyyy-MM-dd')}"></textarea>
                        </div>

                        <div class="form-group">
                            <label for="address">* 주소</label>
                            <textarea
                                    id="address" name="address"
                                    class="short-text"
                                    placeholder="주소를 입력해 주세요."
                            >
</textarea
                            >
                        </div>

                        <div class="form-group">
                            <label for="phone_num">* 전화번호</label>
                            <textarea
                                    id="phone_num" name="phoneNum"
                                    class="short-text"
                                    placeholder="전화번호를 입력해 주세요. ex. 010-0000-0000"
                            ></textarea
                            >
                        </div>

                        <div class="form-group">
                            <label for="education">학력</label>
                            <textarea
                                    id="education" name="education"
                                    class="short-text"
                                    placeholder="학력을 입력해 주세요."
                            >
</textarea
                            >
                        </div>

                        <div class="form-group">
                            <label for="ability">자격증 및 스킬</label>
                            <textarea
                                    id="ability" name="ability"
                                    class="short-text1"
                                    placeholder="자격증 및 스킬을 입력해 주세요."
                            >
</textarea
                            >
                        </div>

                        <div class="form-group">
                            <label for="antecedents">경력</label>
                            <textarea
                                    id="antecedents" name="antecedents"
                                    class="short-text1"
                                    placeholder="경력을 입력해 주세요."
                            >
</textarea
                            >
                        </div>

                        <div class="form-group">
                            <label for="awards">수상이력</label>
                            <textarea
                                    id="awards" name="awards"
                                    class="short-text1"
                                    placeholder="수상이력을 입력해 주세요."
                            >
</textarea
                            >
                        </div>
                    </td>
                </tr>

            <tr>
                <th><textarea name="resumeContents[0].question" placeholder="* 질문 1을 입력하세요."></textarea></th>
                <td><textarea name="resumeContents[0].context" placeholder="* 답변을 입력하세요."></textarea></td>
            </tr>
            <tr>
                <th><textarea name="resumeContents[1].question" placeholder="질문 2을 입력하세요."></textarea></th>
                <td><textarea name="resumeContents[1].context" placeholder="답변을 입력하세요."></textarea></td>
            </tr>
            <tr>
                <th><textarea name="resumeContents[2].question" placeholder="질문 3을 입력하세요."></textarea></th>
                <td><textarea name="resumeContents[2].context" placeholder="답변을 입력하세요."></textarea></td>
            </tr>
            <tr>
                <th><textarea name="resumeContents[3].question" placeholder="질문 4을 입력하세요."></textarea></th>
                <td><textarea name="resumeContents[3].context" placeholder="답변을 입력하세요."></textarea></td>
            </tr>
                <tr>
                    <th class="link">
                        포트폴리오 링크를<br />
                        넣어주세요.
                    </th>
                    <td>
              <textarea
                      id="context" name="context"
                      placeholder="예: https://github.com/yourname/portfolio"
              ></textarea>
                    </td>
                </tr>
            </table>
            <div class="button-group">
                <button type="button" onclick="location.href='/mypage/react_list'">취소</button>
                <button type="submit">저장</button>
            </div>
        </form>

    </div>

    <div th:replace="include/footer :: footer"></div>
  </body>
</html>
