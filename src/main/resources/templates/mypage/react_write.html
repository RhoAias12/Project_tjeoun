<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이력서 작성</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/react.css}" />
    <script defer src="../../../../../../final_project/front/js/main.js"></script>

      <script>
          // 이미지 미리보기 함수
          function previewImage(event) {
              const file = event.target.files[0];
              const reader = new FileReader();
              reader.onload = function (e) {
                  const preview = document.getElementById('preview');
                  preview.src = e.target.result;
              };
              if (file) {
                  reader.readAsDataURL(file);
                  document.getElementById('fileName').innerText = file.name;
              }
          }
      </script>
  </head>
  <body>
    <div th:replace="include/header :: header"></div>
    <div class="page-title">
      <p>마이페이지 &gt; 이력서</p>
    </div>
    <div class="container">
        <form th:action="@{/mypage/react_write}" method="post" enctype="multipart/form-data">
            <table class="resume-table">
                <tr>
                    <th>제목</th>
                    <td>
                        <input type="text" name="title" th:value="${resumeDto.title}" placeholder="제목을 입력하세요" required />
                    </td>
                </tr>
                <tr>
                    <th>이력서 내용</th>
                    <td>
                        <textarea name="context" th:value="${resumeDto.context}" placeholder="이력서를 입력하세요" required></textarea>
                    </td>
                </tr>
                <tr>
                    <th>주소</th>
                    <td>
                        <textarea name="address" th:value="${resumeDto.address}" placeholder="주소를 입력하세요" required></textarea>
                    </td>
                </tr>
                <tr>
                    <th>전화번호</th>
                    <td>
                        <textarea name="phoneNum" th:value="${resumeDto.phoneNum}" placeholder="전화번호를 입력하세요" required></textarea>
                    </td>
                </tr>
                <tr>
                    <th>학력</th>
                    <td>
                        <textarea name="education" th:value="${resumeDto.education}" placeholder="학력을 입력하세요" required></textarea>
                    </td>
                </tr>
                <tr>
                    <th>스킬</th>
                    <td>
                        <textarea name="ability" th:value="${resumeDto.ability}" placeholder="스킬을 입력하세요" required></textarea>
                    </td>
                </tr>
                <tr>
                    <th>경력</th>
                    <td>
                        <textarea name="antecedents" th:value="${resumeDto.antecedents}" placeholder="경력을 입력하세요" required></textarea>
                    </td>
                </tr>
                <tr>
                    <th>수상이력</th>
                    <td>
                        <textarea name="awards" th:value="${resumeDto.awards}" placeholder="수상이력을 입력하세요" required></textarea>
                    </td>
                </tr>
                <tr>
                    <th>이미지</th>
                    <td>
                        <input type="file" name="img" required />
                    </td>
                </tr>
            </table>
            <div class="button-group">
                <button type="submit">저장</button>
                <button type="button" onclick="location.href='/mypage/react_list'">취소</button>
            </div>
        </form>

    </div>
    <div class="button-group">
      <button type="button" onclick="location.href='/mypage/react_list'">취소</button>
      <button type="submit">저장</button>
    </div>
    <div th:replace="include/footer :: footer"></div>
  </body>
</html>
