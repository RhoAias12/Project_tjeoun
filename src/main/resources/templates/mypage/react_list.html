<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/resume_care.css}" />
<!--    <link rel="stylesheet" href="./css/resume_care.css" />-->
    <title>이력서관리</title>
  </head>
  <body>
    <!-- 헤더 -->
    <div th:replace="include/header :: header"></div>

    <!-- 전체 컨테이너 -->
    <div class="tab-box">
      <div class="tab-inner">
        <h2 class="mypage-title">마이페이지</h2>

        <!-- 탭 버튼 -->
        <div class="tab-buttons">
          <button class="tab" onclick="location.href='/mypage/member_modify'">회원정보수정</button>
          <button class="tab1" onclick="location.href='/mypage/react_list'">이력서관리</button>
          <button class="tab" onclick="location.href='/mypage/apply_status'">지원현황</button>
          <button class="tab" onclick="location.href='/mypage/scrap'">스크랩</button>
        </div>

        <button class="tab5" onclick="location.href='/mypage/react_write'">추가</button>

        <!-- 게시물 리스트 -->
        <div class="resume-list">
          <a th:href="@{/mypage/react_detail/{id}(id=${resume.id})}" class="resume-card">
            <span class="resume-title">이력서 1</span>
            <button class="delete-button" onclick="event.stopPropagation();">삭제</button>
          </a>

          <a th:href="@{/mypage/react_detail/{id}(id=${resume.id})}" class="resume-card">
            <span class="resume-title">이력서 2</span>
            <button class="delete-button" onclick="event.stopPropagation();">삭제</button>
          </a>

          <a th:href="@{/mypage/react_detail/{id}(id=${resume.id})}" class="resume-card">
            <span class="resume-title">이력서 3</span>
            <button class="delete-button" onclick="event.stopPropagation();">삭제</button>
          </a>

          <a th:href="@{/mypage/react_detail/{id}(id=${resume.id})}" class="resume-card">
            <span class="resume-title">이력서 4</span>
            <button class="delete-button" onclick="event.stopPropagation();">삭제</button>
          </a>
        </div>

        <!-- 페이지네이션 -->
        <div class="pagination">
          <ul class="pagination-list">
            <li><a href="#" class="page-btn">〈</a></li>
            <li><a href="#" class="page-btn active">1</a></li>
            <li><a href="#" class="page-btn">2</a></li>
            <li><a href="#" class="page-btn">3</a></li>
            <li><a href="#" class="page-btn">4</a></li>
            <li><a href="#" class="page-btn">5</a></li>
            <li><a href="#" class="page-btn">〉</a></li>
          </ul>
        </div>
      </div>
    </div>
    <!-- 푸터 -->
    <div th:replace="include/footer :: footer"></div>
  </body>
</html>
