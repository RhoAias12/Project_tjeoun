<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이력서 상세페이지</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/react.css}" />
    <script defer src="js/main.js"></script>

    <!-- 이미지 미리보기 -->
    <script>
      function previewImage(event) {
          const file = event.target.files[0];
          const reader = new FileReader();
          reader.onload = function (e) {
              const preview = document.getElementById('preview');
              preview.src = e.target.result;
          };
          if (file) {
              reader.readAsDataURL(file);
              document.getElementById('fileName').innerText = file.name;
          }
      }
    </script>

  </head>
  <body>
    <div th:replace="include/header :: header"></div>
    <div class="page-title">
      <p>마이페이지 &gt; 이력서</p>
    </div>
    <div class="container">
      <form>
        <table class="resume-table">
          <!-- 첫 줄: 이미지 텍스트 -->
          <!-- 제목 -->
          <tr>
            <th scope="row">제목</th>
            <td class="centered-cell">
              <div class="form-group">
                <p class="readonly-box1" th:text="${resume.title}">제목</p>
              </div>
            </td>
          </tr>

          <tr>
            <!-- 왼쪽: 이미지 + 파일 선택 -->
            <th style="text-align: center">
              <img id="preview" th:src="@{${resume.img}}" alt="미리보기 없음" />
              <input type="file" id="imageUpload" accept="image/*" onchange="previewImage(event)" />
              <div id="fileName" style="margin-top: 4px"></div>
            </th>

            <!-- 오른쪽: 개인정보 출력 -->
            <td>
              <div class="form-group">
                <label class="thick">이름</label>
                <p class="readonly-box1" th:text="${resume.user.userName}">이름</p>
              </div>

              <div class="form-group">
                <label class="thick">이메일</label>
                <p class="readonly-box1" th:text="${resume.user.userEmail}">이메일</p>
              </div>

              <div class="form-group">
                <label class="thick">생년월일</label>
                <p class="readonly-box1" th:text="${#temporals.format(resume.user.userBirth, 'yyyy-MM-dd')}">1995-07-01</p>
              </div>

              <div class="form-group">
                <label>주소</label>
                <p class="readonly-box1" th:text="${resume.address}">주소</p>
              </div>

              <div class="form-group">
                <label>전화번호</label>
                <p class="readonly-box1" th:text="${resume.phoneNum}">전화번호</p>
              </div>

              <div class="form-group">
                <label>학력</label>
                <p class="readonly-box1" th:text="${resume.education}">학력</p>
              </div>

              <div class="form-group">
                <label>스킬</label>
                <p class="readonly-box1" th:text="${resume.ability}">스킬</p>
              </div>

              <div class="form-group">
                <label>경력</label>
                <p class="readonly-box1" th:text="${resume.antecedents}">경력</p>
              </div>

              <div class="form-group">
                <label>수상이력</label>
                <p class="readonly-box1" th:text="${resume.awards}">수상이력</p>
              </div>
            </td>
          </tr>

          <!-- 질문 1 -->
          <tr>
            <th>
              <div class="question">
                <p>질문1.</p>
                <p>본인 소개 부탁드립니다.</p>
              </div>
            </th>
            <td>
              <p class="content" th:text="${resume.context}">내용</p>
            </td>
          </tr>

          <!-- 포트폴리오 링크 -->
          <tr>
            <th class="link">포트폴리오 링크를<br />넣어주세요.</th>
            <td>
              <p class="content" th:text="${resume.img}">포트폴리오 링크</p>
            </td>
          </tr>
        </table>
      </form>
    </div>

    <div class="button-group">
      <form th:action="@{/mypage/react_delete/{id}(id=${resume.resumeIdx})}" method="post" onsubmit="return confirm('정말 삭제하시겠습니까?');">
        <button type="submit">삭제</button>
      </form>

      <form th:action="@{/mypage/react_modify/{id}(id=${resume.resumeIdx})}" method="post">
        <button type="submit">수정</button>
      </form>
    </div>

    <div th:replace="include/footer :: footer"></div>
  </body>
</html>
