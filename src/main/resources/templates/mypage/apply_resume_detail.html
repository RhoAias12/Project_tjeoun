<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지원 당시 이력서 상세</title>
  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/header.css}" />
  <link rel="stylesheet" th:href="@{/css/footer.css}" />
  <link rel="stylesheet" th:href="@{/css/react.css}" />
</head>
<body>
<div th:replace="include/header :: header"></div>

<div class="page-title">
  <p>마이페이지 &gt; 지원현황 &gt; 지원 이력서</p>
</div>

<div class="container">
  <table class="resume-table">
    <!-- 제목 -->
    <tr>
      <th scope="row">제목</th>
      <td class="centered-cell">
        <div class="form-group">
          <p class="readonly-box1" th:text="${applyResume.title}">제목</p>
        </div>
      </td>
    </tr>

    <!-- 이미지 -->
    <th style="text-align: center">
      <div th:if="${applyResume.img != null}">
        <img class="img" th:src="@{${applyResume.img}}" alt="이력서 이미지 없음" />
      </div>
      <div th:if="${applyResume.img == null}">
        <p>이미지가 없습니다.</p>
      </div>
    </th>

    <!-- 개인정보 -->
    <td>
      <div class="form-group">
        <label class="thick">이름</label>
        <p class="readonly-box1" th:text="${applyResume.user.userName}"></p>
      </div>

      <div class="form-group">
        <label class="thick">이메일</label>
        <p class="readonly-box1" th:text="${applyResume.user.userEmail}"></p>
      </div>

      <div class="form-group">
        <label class="thick">생년월일</label>
        <p class="readonly-box1" th:text="${#temporals.format(applyResume.user.userBirth, 'yyyy-MM-dd')}"></p>
      </div>

      <div class="form-group">
        <label>주소</label>
        <p class="readonly-box1" th:text="${applyResume.address}"></p>
      </div>

      <div class="form-group">
        <label>전화번호</label>
        <p class="readonly-box1" th:text="${applyResume.phoneNum}"></p>
      </div>

      <!-- 학력 -->
      <div class="form-group" th:if="${not #strings.isEmpty(applyResume.education)}">
        <label>학력</label>
        <p class="readonly-box1" th:text="${applyResume.education}"></p>
      </div>

      <!-- 자격증 및 스킬 -->
      <div class="form-group" th:if="${not #strings.isEmpty(applyResume.ability)}">
        <label>자격증 및 스킬</label>
        <p class="readonly-box1" th:text="${applyResume.ability}"></p>
      </div>

      <!-- 경력 -->
      <div class="form-group" th:if="${not #strings.isEmpty(applyResume.antecedents)}">
        <label>경력</label>
        <p class="readonly-box1" th:text="${applyResume.antecedents}"></p>
      </div>

      <!-- 수상이력 -->
      <div class="form-group" th:if="${not #strings.isEmpty(applyResume.awards)}">
        <label>수상이력</label>
        <p class="readonly-box1" th:text="${applyResume.awards}"></p>
      </div>
    </td>
    </tr>

    <!-- 질문/답변 -->
    <tr th:each="content, iterStat : ${applyResume.resumeContents}"
        th:if="${!#strings.isEmpty(content.question) or !#strings.isEmpty(content.context)}">
      <th>
        <div class="question">
          <p th:text="${content.question}"></p>
        </div>
      </th>
      <td>
        <p class="content" th:text="${content.context}"></p>
      </td>
    </tr>

    <!-- 포트폴리오 링크 -->
    <tr th:if="${!#strings.isEmpty(applyResume.context)}">
      <th class="link">포트폴리오 링크</th>
      <td><p class="content" th:text="${applyResume.context}"></p></td>
    </tr>
  </table>

  <div class="button-group">
    <a th:href="@{/mypage/apply_status}">목록보기</a>

    <div th:if="${readonly != null and !readonly}">
      <form th:action="@{/mypage/react_delete/{id}(id=${applyResume.resumeIdx})}" method="post"
            onsubmit="return confirm('정말 삭제하시겠습니까?');">
        <input type="hidden" name="page" th:value="${page}" />
        <button type="submit" class="delete-button">삭제</button>
      </form>
      <button type="button"
              th:onclick="|location.href='@{/mypage/react_modify/{id}(id=${applyResume.resumeIdx})}?page=${page}'|">
        수정
      </button>
    </div>
  </div>
  </form>
</div>

<div th:replace="include/footer :: footer"></div>
</body>
</html>
