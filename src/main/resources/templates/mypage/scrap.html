<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/scrap.css}" />
    <!-- Font Awesome 아이콘 추가 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <title>스크랩</title>

    <script>
      function deleteScrap(recruitmentIdx, userIdx) {
        const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

        fetch(`/mypage/scrap`, {
          method: 'DELETE',
          headers: {
            'Content-Type': 'application/json',
            [csrfHeader]: csrfToken
          },
          body: JSON.stringify({
            userIdx: userIdx,
            recruitmentIdx: recruitmentIdx
          })
        })
        .then(response => {
          if (response.ok) {
            document.getElementById('card-' + recruitmentIdx).remove();
          } else {
            alert("삭제 실패");
          }
        });
      }
    </script>

    <style>
      .gray-text {
        color: gray;
      }
    </style>

  </head>
  <body>
    <!-- 헤더 -->
    <div th:replace="include/header :: header"></div>

    <!-- 전체 컨테이너 -->
    <div class="tab-box">
      <div class="tab-inner">
        <h2 class="mypage-title">마이페이지</h2>

        <!-- 탭 버튼 -->
        <div class="tab-buttons">
          <button class="tab" onclick="location.href='/mypage/member_modify'">회원정보수정</button>
          <button class="tab" onclick="location.href='/mypage/react_list'">이력서관리</button>
          <button class="tab" onclick="location.href='/mypage/apply_status'">지원현황</button>
          <button class="tab1" onclick="location.href='/mypage/scrap'">스크랩</button>
        </div>

        <div class="apply-list">
          <div class="apply-card" th:each="favorite : ${favorites}" th:id="'card-' + ${favorite.recruitmentIdx}">
            <div class="apply-info">
              <div class="job-title">
                <a th:href="@{/recruit/detail/{id}(id=${favorite.recruitmentIdx})}"
                   th:text="${favorite.title}">공고명</a>
              </div>
              <div class="company-name" th:text="${favorite.company}">회사명</div>
            </div>
            <div class="apply-side">
              <span class="deadline"
                      th:classappend="${favorite.deadline.isBefore(T(java.time.LocalDate).now())} ? 'gray-text'">
                <span th:if="${favorite.deadline == T(java.time.LocalDate).parse('9999-12-31')}" th:utext="'상시채용'"></span>
                <span th:unless="${favorite.deadline == T(java.time.LocalDate).parse('9999-12-31')}"
                      th:utext="'마감일<br/>' + ${#temporals.format(favorite.deadline, 'yyyy.MM.dd')}"></span>
              </span>
              <div class="apply-action">
                <i class="fa-bookmark bookmark-icon fa-solid active"
                   th:onclick="|deleteScrap(${favorite.recruitmentIdx}, ${favorite.userIdx})|">
                </i>
                <a th:href="@{/recruit/apply/{id}(id=${favorite.recruitmentIdx})}">
                  <button class="apply-btn">지원하기</button>
                </a>
              </div>
            </div>
          </div>
        </div>


        <!-- 페이지네이션 -->
        <div th:replace="fragments/pagination :: fragment(${jobPage},
          ${startPage}, ${endPage}, '/mypage/scrap')">
        </div>
      </div>
    </div>

    <!-- 푸터 -->
    <div th:replace="include/footer :: footer"></div>
  </body>
</html>
