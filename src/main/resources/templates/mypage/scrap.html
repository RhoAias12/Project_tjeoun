<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/scrap.css}" />
    <!-- Font Awesome 아이콘 추가 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <title>스크랩</title>

    <script>
      function deleteScrap(recruitmentIdx, userIdx) {
  const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
  const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

  fetch(`/mypage/scrap`, {
    method: 'DELETE',
    headers: {
      'Content-Type': 'application/json',
      [csrfHeader]: csrfToken
    },
    body: JSON.stringify({
      userIdx: userIdx,
      recruitmentIdx: recruitmentIdx
    })
  })
  .then(response => {
    if (response.ok) {
      // 삭제 성공하면 해당 카드 제거
      const cardElement = document.getElementById('card-' + recruitmentIdx);
      if (cardElement) cardElement.remove();

      // 삭제 후 페이지에 남은 카드가 없으면 이전 페이지로 이동
      setTimeout(() => {
        const cards = document.querySelectorAll('.apply-card'); // 여기 클래스명 변경!
        console.log("남은 카드 수:", cards.length);

        if (cards.length === 0) {
          // 현재 페이지 번호 파싱 (URL 쿼리스트링에서 page 파라미터 읽기)
          const urlParams = new URLSearchParams(window.location.search);
          let currentPage = parseInt(urlParams.get('page')) || 1;

          if (currentPage > 1) {
            // 이전 페이지로 이동
            window.location.href = `/mypage/scrap?page=${currentPage - 1}`;
          } else {
            // 1페이지인데도 빈 페이지면 그냥 새로고침
            location.reload();
          }
        }
      }, 50);

    } else {
      alert("삭제 실패");
    }
  });
}



      function checkAndGoApply(recruitmentIdx) {
        fetch(`/mypage/check_applied/${recruitmentIdx}`)
          .then(response => response.json())
          .then(data => {
            if (data.applied) {
              alert("이미 지원한 공고입니다. 중복 지원은 불가능합니다.");
            } else {
              window.location.href = `/mypage/choice_list/${recruitmentIdx}`;
            }
          })
          .catch(error => {
            console.error("지원 여부 확인 실패", error);
            alert("잠시 후 다시 시도해주세요.");
          });
      }
    </script>

    <style>
      .gray-text {
        color: gray;
      }
    </style>

  </head>
  <body>
    <!-- 헤더 -->
    <div th:replace="include/header :: header"></div>

    <!-- 전체 컨테이너 -->
    <div class="tab-box">
      <div class="tab-inner">
        <h2 class="mypage-title">마이페이지</h2>

        <!-- 탭 버튼 -->
        <div class="tab-buttons">
          <button class="tab" onclick="location.href='/mypage/member_modify'">회원정보수정</button>
          <button class="tab" onclick="location.href='/mypage/react_list'">이력서관리</button>
          <button class="tab" onclick="location.href='/mypage/apply_status'">지원현황</button>
          <button class="tab1" onclick="location.href='/mypage/scrap'">스크랩</button>
        </div>

        <div class="apply-list">
          <div class="apply-card" th:each="favorite : ${favorites}" th:id="'card-' + ${favorite.recruitmentIdx}">
            <div class="apply-info">
              <div class="job-title">
                <a th:href="@{/empl/empl_detail/{id}(id=${favorite.recruitmentIdx}, prevUrl=${'/mypage/scrap?page=' + (jobPage.number + 1)})}"
                   th:text="${favorite.title}">공고명</a>
              </div>
              <div class="company-name" th:text="${favorite.company}">회사명</div>
            </div>
            <div class="apply-side">
              <span class="deadline"
                    th:classappend="${favorite.deadline.isBefore(T(java.time.LocalDate).now())} ? 'gray-text'">
                <span th:if="${favorite.deadline == T(java.time.LocalDate).parse('9999-12-31')}" th:utext="'상시채용'"></span>
                <span th:unless="${favorite.deadline == T(java.time.LocalDate).parse('9999-12-31')}"
                      th:utext="'마감일<br/>' + ${#temporals.format(favorite.deadline, 'yyyy.MM.dd')}"></span>
              </span>
              <div class="apply-action">
                <i class="fa-bookmark bookmark-icon fa-solid active"
                   th:onclick="|deleteScrap(${favorite.recruitmentIdx}, ${favorite.userIdx})|">
                </i>

                <button class="apply-btn"
                        th:onclick="|checkAndGoApply(${favorite.recruitmentIdx})|">
                  지원하기
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- 페이지네이션 -->
        <div th:replace="~{fragments/pagination :: fragment(${jobPage}, ${startPage}, ${endPage}, '/mypage/scrap')}"></div>

      </div>
    </div>

    <!-- 푸터 -->
    <div th:replace="include/footer :: footer"></div>
  </body>
</html>
