<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/header.css}" />
    <link rel="stylesheet" th:href="@{/css/footer.css}" />
    <link rel="stylesheet" th:href="@{/css/scrap.css}" />
    <!-- Font Awesome 아이콘 추가 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <title>스크랩</title>

    <script>
      function toggleBookmark(element) {
        element.classList.toggle('fa-regular');
        element.classList.toggle('fa-solid');
        element.classList.toggle('active');
      }

      function deleteScrap(recruitmentIdx) {
      const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
      const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

      fetch(`/mypage/scrap/${recruitmentIdx}`, {
        method: 'DELETE',
        headers: {
          [csrfHeader]: csrfToken
        }
      })
      .then(response => {
        if (response.ok) {
          document.getElementById('card-' + recruitmentIdx).remove();
        } else {
          alert("삭제 실패");
        }
      });
    }
    </script>

    <style>
      .gray-text {
        color: gray;
      }
    </style>

  </head>
  <body>
    <!-- 헤더 -->
    <div th:replace="include/header :: header"></div>

    <!-- 전체 컨테이너 -->
    <div class="tab-box">
      <div class="tab-inner">
        <h2 class="mypage-title">마이페이지</h2>

        <!-- 탭 버튼 -->
        <div class="tab-buttons">
          <button class="tab" onclick="location.href='/mypage/member_modify'">회원정보수정</button>
          <button class="tab" onclick="location.href='/mypage/react_list'">이력서관리</button>
          <button class="tab" onclick="location.href='/mypage/apply_status'">지원현황</button>
          <button class="tab1" onclick="location.href='/mypage/scrap'">스크랩</button>
        </div>

        <div class="apply-list">
          <div class="apply-card" th:each="favorite : ${favorites}" th:id="'card-' + ${favorite.recruitment.recruitmentIdx}">
            <div class="apply-info">
              <div class="job-title">
                <a th:href="@{/recruit/detail/{id}(id=${favorite.recruitment.recruitmentIdx})}"
                   th:text="${favorite.recruitment.title}">공고명</a>
              </div>
              <div class="company-name" th:text="${favorite.recruitment.company}">회사명</div>
            </div>
            <div class="apply-side">
              <span class="deadline"
                    th:classappend="${favorite.recruitment.deadline.isBefore(T(java.time.LocalDate).now())} ? 'gray-text'"
                    th:utext="'마감일<br/>' + ${#temporals.format(favorite.recruitment.deadline, 'yyyy.MM.dd')}">마감일</span>
              <div class="apply-action">
                <i class="fa-bookmark bookmark-icon fa-solid active"
                   th:onclick="deleteScrap([[${favorite.recruitment.recruitmentIdx}]])">
                </i>
                <a th:href="@{/recruit/apply/{id}(id=${favorite.recruitment.recruitmentIdx})}">
                  <button class="apply-btn">지원하기</button>
                </a>
              </div>
            </div>
          </div>
        </div>


        <!-- 페이지네이션 -->
        <div class="pagination">
          <ul class="pagination-list">
            <li><a href="#" class="page-btn">〈</a></li>
            <li><a href="#" class="page-btn active">1</a></li>
            <li><a href="#" class="page-btn">2</a></li>
            <li><a href="#" class="page-btn">3</a></li>
            <li><a href="#" class="page-btn">4</a></li>
            <li><a href="#" class="page-btn">5</a></li>
            <li><a href="#" class="page-btn">〉</a></li>
          </ul>
        </div>
      </div>
    </div>

    <!-- 푸터 -->
    <div th:replace="include/footer :: footer"></div>
  </body>
</html>
